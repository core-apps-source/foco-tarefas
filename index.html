<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Foco — Tarefas</title>
<link rel="icon" href="assets/prototype.png" />
<link rel="apple-touch-icon" href="assets/prototype.png" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

  --bg: #0b0b14;             /* Cor de fundo principal (bem escura) */
  --surface: #13131f;        /* Cor de superfície primária */
  --surface2: #1e1e30;       /* Cor de superfície secundária */
  --surface3: #252538;       /* Cor de superfície terciária */
  --accent: #ff6bb3;
  --accent2: #e879f9;
  --accent-light: #ffb5e6;
  --green: #2ed573;
  --red: #ff6b6b;
  --text: #e8e4f4;
  --muted: #6b6880;
  --border: rgba(255,255,255,0.06);
  --r: 16px;
  --font: 'Outfit', sans-serif;
}
[data-theme="rosa"]{--accent:#ff6bb3;--accent2:#e879f9;--accent-light:#ffb5e6;}
[data-theme="laranja"]{--accent:#ff9f43;--accent2:#8b7cf6;--accent-light:#ffcc70;}
[data-theme="azul"]{--accent:#3b82f6;--accent2:#1d4ed8;--accent-light:#60a5fa;}
[data-theme="vermelho"]{--accent:#ef4444;--accent2:#dc2626;--accent-light:#f87171;}
[data-theme="lilas"]{--accent:#c084fc;--accent2:#a78bfa;--accent-light:#ddd6fe;}
[data-theme="azul"] body{background:linear-gradient(165deg,#020617 0%,#0c1929 42%,#0f172a 100%);background-attachment:fixed;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:stretch;}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 90px;scroll-behavior:smooth;}
.view::-webkit-scrollbar{width:3px;}
.view::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px;}
.header{padding:52px 20px 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,var(--bg) 80%,transparent);position:sticky;top:0;z-index:10;}
.header-left h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.header-left h1 span{color:var(--accent);}
.header-left p{font-size:13px;color:var(--muted);margin-top:2px;}
.header-btns{display:flex;gap:8px;}
.header-btn{width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;transition:all .15s;}
.header-btn:hover{background:var(--surface3);}
.ring-section{display:flex;flex-direction:column;align-items:center;padding:12px 20px 24px;}
.ring-wrap{position:relative;width:140px;height:140px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:10;}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
.ring-fill.ring-future{stroke:var(--accent2);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-pct{font-size:30px;font-weight:800;line-height:1;color:var(--accent);}
.ring-pct.ring-future{color:var(--accent2);}
.ring-label{font-size:11px;color:var(--muted);font-weight:500;margin-top:3px;letter-spacing:.5px;text-transform:uppercase;}
.ring-meta{margin-top:10px;font-size:13px;color:var(--muted);}
.ring-meta b{color:var(--text);font-weight:600;}
.tasks-list{display:flex;flex-direction:column;gap:8px;padding:0 16px;}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;transition:all .15s;position:relative;overflow:hidden;}
.task-card:hover{background:var(--surface2);}
.task-card.done{opacity:.55;}
.task-card.done .task-name{text-decoration:line-through;color:var(--muted);}
.task-card.overdue{border-left:3px solid var(--red);}
.task-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;}
.task-card.goal-card::before{opacity:1;}
.check-btn{width:26px;height:26px;border-radius:8px;border:2px solid var(--surface3);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .15s;font-size:14px;}
.check-btn:hover{border-color:var(--accent);}
.check-btn.checked{background:var(--accent);border-color:var(--accent);color:#fff;}
.task-body{flex:1;min-width:0;}
.task-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.task-sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.task-time-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface2);}
.task-time-badge.late{background:rgba(255,107,107,.15);color:var(--red);}
.done-time-chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(46,213,115,.1);color:var(--green);border:1px solid rgba(46,213,115,.2);}
.goal-bar-wrap{margin-top:8px;}
.goal-bar-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;}
.goal-bar-top span:last-child{color:var(--accent);font-weight:600;}
.goal-bar{height:5px;background:var(--surface3);border-radius:999px;overflow:hidden;}
.goal-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-light));border-radius:999px;transition:width .4s ease;}
.goal-bar-fill.full{background:linear-gradient(90deg,var(--accent),var(--accent-light));filter:brightness(1.1);}
.detail-progress-fill.is-overall{background:linear-gradient(90deg,var(--accent),var(--accent-light));}
.task-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.log-btn{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border:none;border-radius:8px;padding:5px 10px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.log-btn:hover{background:color-mix(in srgb,var(--accent) 30%,transparent);}
.revert-btn{background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.revert-btn:hover{background:var(--surface3);}
.empty-state{text-align:center;padding:48px 32px;color:var(--muted);}
.empty-state .emoji{font-size:48px;margin-bottom:12px;}
.empty-state p{font-size:14px;line-height:1.6;}
.fab{position:fixed;bottom:88px;right:50%;transform:translateX(calc(50% - 8px));width:56px;height:56px;border-radius:18px;background:var(--accent);border:none;cursor:pointer;font-size:28px;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px color-mix(in srgb,var(--accent) 40%,transparent);transition:all .15s;z-index:20;}
.fab:hover{filter:brightness(1.1);}
@media(max-width:480px){.fab{right:20px;transform:none;}}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(11,11,20,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:var(--font);transition:color .15s;}
.nav-btn.active{color:var(--accent);}
.nav-icon{font-size:20px;}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.period-tabs{display:flex;gap:8px;padding:0 20px 16px;}
.period-tab{flex:1;padding:8px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-family:var(--font);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;text-align:center;}
.period-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.summary-card{margin:0 16px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;}
.summary-card-title{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}
.stat-row{display:flex;gap:10px;}
.stat-box{flex:1;background:var(--surface2);border-radius:12px;padding:12px;text-align:center;}
.stat-val{font-size:22px;font-weight:800;color:var(--accent);}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px;}
.day-bar-chart{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:4px;}
.day-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.day-bar{width:100%;border-radius:6px 6px 0 0;background:var(--accent);opacity:.3;min-height:4px;transition:all .3s;}
.day-bar.filled{opacity:1;}
.day-bar-label{font-size:10px;color:var(--muted);font-weight:600;}
.day-bar-pct{font-size:9px;color:var(--muted);}
.insight-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.insight-item:last-child{border-bottom:none;padding-bottom:0;}
.insight-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.insight-text{font-size:13px;color:var(--text);line-height:1.5;}
.insight-text span{color:var(--accent);font-weight:600;}
.insight-action button{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-family:var(--font);font-size:12px;font-weight:600;color:var(--text);cursor:pointer;margin-top:6px;}
.hour-bar-wrap{display:flex;align-items:flex-end;gap:2px;height:50px;margin-top:8px;}
.hour-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.hour-bar{width:100%;border-radius:3px 3px 0 0;background:var(--accent2);opacity:.15;min-height:2px;transition:all .3s;}
.hour-bar.has-data{opacity:.9;}
.hour-bar.peak{background:var(--accent);opacity:1;}
.hour-tick{font-size:8px;color:var(--muted);font-weight:600;}
.manage-task-item{margin:0 16px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;gap:12px;padding:14px 16px;}
.manage-task-info{flex:1;min-width:0;}
.manage-task-name{font-size:14px;font-weight:600;}
.manage-task-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.manage-actions{display:flex;gap:6px;}
.manage-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .15s;}
.manage-btn.del:hover{background:rgba(255,107,107,.15);border-color:var(--red);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s;}
.overlay.center{align-items:center;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:24px 20px 40px;max-height:92vh;overflow-y:auto;animation:slideUp .25s cubic-bezier(.4,0,.2,1);}
.modal.card-modal{border-radius:20px;margin:16px;max-height:84vh;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal-handle{width:36px;height:4px;background:var(--surface3);border-radius:999px;margin:0 auto 20px;}
.modal-title{font-size:18px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
.form-group{margin-bottom:16px;}
.form-label{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block;}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-family:var(--font);font-size:15px;color:var(--text);outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--accent);}
.form-input::placeholder{color:var(--muted);}
.toggle-group{display:flex;gap:8px;flex-wrap:wrap;}
.toggle-btn{flex:1;padding:10px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-family:var(--font);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;text-align:center;}
.toggle-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);}
.btn-primary{width:100%;padding:14px;border-radius:14px;background:var(--accent);border:none;font-family:var(--font);font-size:15px;font-weight:700;color:#fff;cursor:pointer;transition:all .15s;margin-top:8px;display:block;text-align:center;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-secondary{width:100%;padding:14px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);font-family:var(--font);font-size:15px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;margin-top:6px;display:block;text-align:center;}
.btn-secondary:hover{background:var(--surface3);}
.dist-day-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.dist-day-label{font-size:13px;font-weight:600;min-width:56px;color:var(--muted);}
.dist-day-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:var(--font);font-size:14px;color:var(--text);outline:none;text-align:center;}
.dist-day-input:focus{border-color:var(--accent);}
.dist-total{font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:600;}
.dist-total.ok{background:rgba(46,213,115,.1);color:var(--green);}
.dist-total.over{background:rgba(255,107,107,.1);color:var(--red);}
.option-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.option-btn{width:100%;padding:13px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-family:var(--font);font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:all .15s;text-align:left;display:flex;align-items:center;gap:10px;}
.option-btn:hover{background:var(--surface3);}
.option-btn .opt-icon{font-size:20px;flex-shrink:0;}
.log-controls{display:flex;align-items:center;gap:12px;margin:16px 0;}
.log-ctrl-btn{width:52px;height:52px;border-radius:16px;background:var(--surface2);border:1px solid var(--border);font-size:24px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font);transition:all .15s;}
.log-ctrl-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;font-family:var(--font);font-size:20px;font-weight:700;color:var(--text);outline:none;text-align:center;}
.log-ctrl-input:focus{border-color:var(--accent);}
.missed-task-info{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-bottom:16px;}
.missed-task-name{font-size:16px;font-weight:700;}
.missed-task-time{font-size:13px;color:var(--red);margin-top:3px;}
.sync-option{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:all .15s;margin-bottom:8px;}
.sync-option:hover{background:var(--surface3);}
.sync-icon-wrap{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.sync-option-info{flex:1;}
.sync-option-title{font-size:14px;font-weight:700;}
.sync-option-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;color:var(--muted);}
.chip.green{background:rgba(46,213,115,.1);color:var(--green);border-color:rgba(46,213,115,.2);}
.chip.orange{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 20%,transparent);}
.wizard-steps{display:flex;gap:6px;margin-bottom:20px;}
.wizard-step{height:3px;flex:1;border-radius:999px;background:var(--surface3);}
.wizard-step.done{background:var(--accent);}
.section-badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 8px;font-size:12px;font-weight:600;color:var(--muted);margin:0 20px 12px;}
.section-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--surface3);color:var(--text);padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;animation:toastIn .2s ease;white-space:nowrap;border:1px solid var(--border);}
.toast.success{background:rgba(46,213,115,.15);color:var(--green);border-color:rgba(46,213,115,.3);}
.toast.error{background:rgba(255,107,107,.15);color:var(--red);border-color:rgba(255,107,107,.3);}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.data-textarea{width:100%;height:90px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-family:monospace;font-size:11px;color:var(--muted);resize:none;outline:none;}
.data-textarea:focus{border-color:var(--accent);color:var(--text);}
.day-reset-banner{margin:0 16px 12px;background:rgba(139,124,246,.12);border:1px solid rgba(139,124,246,.25);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--accent2);}
.day-reset-banner b{font-weight:700;}

/* ===== TASK DETAIL MODAL ===== */
.detail-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.detail-icon{width:52px;height:52px;border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.detail-title{font-size:19px;font-weight:800;line-height:1.2;}
.detail-type-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:6px;margin-top:4px;}
.detail-type-badge.goal{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);}
.detail-type-badge.simple{background:rgba(46,213,115,.12);color:var(--green);border:1px solid rgba(46,213,115,.25);}

.detail-meta-row{display:flex;gap:8px;margin-bottom:16px;}
.detail-meta-box{flex:1;background:var(--surface2);border-radius:12px;padding:11px 12px;}
.detail-meta-label{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.detail-meta-val{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;}
.detail-meta-val.accent{color:var(--accent);}
.detail-meta-val.green{color:var(--green);}
.detail-meta-val.red{color:var(--red);}

.detail-section{margin-bottom:18px;}
.detail-section-title{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px;}

/* Timeline grid */
.timeline-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.tl-col-head{font-size:9px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0;letter-spacing:.3px;}
.tl-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;position:relative;cursor:default;}
.tl-cell.tl-done{background:rgba(46,213,115,.2);color:var(--green);border:1px solid rgba(46,213,115,.3);}
.tl-cell.tl-partial{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);}
.tl-cell.tl-missed{background:rgba(255,107,107,.15);color:var(--red);border:1px solid rgba(255,107,107,.2);}
.tl-cell.tl-today{outline:2px solid var(--accent);outline-offset:1px;}
.tl-cell.tl-future{background:var(--surface3);color:var(--muted);border:1px solid transparent;}
.tl-cell.tl-empty{background:transparent;border:none;}
.tl-cell.tl-skipped{background:var(--surface3);color:var(--muted);border:1px dashed rgba(255,255,255,.1);}

/* Missed list */
.missed-day-list{display:flex;flex-direction:column;gap:6px;}
.missed-day-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.15);border-radius:10px;}
.missed-day-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;}
.missed-day-info{flex:1;}
.missed-day-date{font-size:13px;font-weight:700;color:var(--text);}
.missed-day-detail{font-size:11px;color:var(--muted);margin-top:1px;}
.missed-day-pct{font-size:12px;font-weight:700;color:var(--red);}

/* Overall progress bar in detail */
.detail-progress-bar{height:8px;background:var(--surface3);border-radius:999px;overflow:hidden;margin-top:6px;}
.detail-progress-fill{height:100%;border-radius:999px;transition:width .5s ease;}

/* Legend row */
.legend-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:3px;}

/* tap hint on task card */
.task-card{cursor:pointer;}
.task-card .tap-hint{font-size:10px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:3px;opacity:.6;}

/* ===== DATE STRIP ===== */
.date-strip-wrap{position:sticky;top:98px;z-index:9;background:var(--bg);padding:0 0 10px;}
.date-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;scroll-behavior:smooth;-ms-overflow-style:none;scrollbar-width:none;}
.date-strip::-webkit-scrollbar{display:none;}
.date-pill{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:14px;cursor:pointer;border:1.5px solid transparent;background:var(--surface);transition:all .18s;min-width:52px;}
.date-pill:hover{background:var(--surface2);}
.date-pill.selected{background:var(--accent);border-color:var(--accent);}
.date-pill.selected .dp-dow{color:rgba(255,255,255,.75);}
.date-pill.selected .dp-num{color:#fff;}
.date-pill.is-today:not(.selected){border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);}
.dp-dow{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
.dp-num{font-size:18px;font-weight:800;color:var(--text);line-height:1;}
.dp-dot-row{display:flex;gap:2px;min-height:6px;align-items:center;}
.dp-dot{width:5px;height:5px;border-radius:50%;}
.dp-dot.green{background:var(--green);}
.dp-dot.orange{background:var(--accent);}
.dp-dot.red{background:var(--red);}
.dp-dot.future{background:var(--surface3);}

/* ===== FUTURE / PAST DAY BANNER ===== */
.day-banner{margin:0 16px 14px;border-radius:14px;padding:11px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;}
.day-banner.future{background:rgba(139,124,246,.12);border:1px solid rgba(139,124,246,.25);color:var(--accent2);}
.day-banner.past{background:rgba(107,104,128,.10);border:1px solid rgba(107,104,128,.2);color:var(--muted);}
.day-banner-icon{font-size:18px;}

/* Future card preview */
.task-card.preview{opacity:.85;cursor:default;}
.task-card.preview:hover{background:var(--surface);}
.goal-preview-amount{font-size:22px;font-weight:900;color:var(--accent);line-height:1;}
.goal-preview-unit{font-size:12px;color:var(--muted);margin-top:1px;}
.goal-preview-right{text-align:right;flex-shrink:0;}
.goal-total-pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--muted);margin-top:6px;}

/* ===== MEDALS ===== */
.medal-badge{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;border:1px solid;}
.medal-badge.bronze{background:rgba(180,100,30,.15);color:#cd7f32;border-color:rgba(180,100,30,.3);}
.medal-badge.prata{background:rgba(160,160,180,.15);color:#a8a9ad;border-color:rgba(160,160,180,.35);}
.medal-badge.ouro{background:rgba(255,200,0,.15);color:#c9a800;border-color:rgba(255,200,0,.35);}
.medal-badge.platinum{background:rgba(100,220,255,.13);color:#3db8d8;border-color:rgba(100,220,255,.3);}
.rank-task-row{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface2);border-radius:12px;margin-bottom:8px;}
.rank-task-name{flex:1;font-size:14px;font-weight:700;}
.rank-medals{display:flex;gap:5px;flex-wrap:wrap;}
.rank-medal-count{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:800;padding:2px 7px;border-radius:7px;border:1px solid;}
.rank-medal-count.bronze{background:rgba(180,100,30,.12);color:#cd7f32;border-color:rgba(180,100,30,.25);}
.rank-medal-count.prata{background:rgba(160,160,180,.12);color:#a8a9ad;border-color:rgba(160,160,180,.3);}
.rank-medal-count.ouro{background:rgba(255,200,0,.12);color:#c9a800;border-color:rgba(255,200,0,.3);}
.rank-medal-count.platinum{background:rgba(100,220,255,.1);color:#3db8d8;border-color:rgba(100,220,255,.25);}

.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 24px;}
.theme-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;font-family:var(--font);transition:all .2s;display:flex;flex-direction:column;gap:10px;}
.theme-card:hover{background:var(--surface2);}
.theme-card.active{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent);}
.theme-swatch{height:52px;border-radius:12px;border:1px solid var(--border);}
.theme-card-name{font-size:14px;font-weight:700;color:var(--text);}
.theme-card-desc{font-size:11px;color:var(--muted);margin-top:-4px;}
.theme-card-check{font-size:11px;font-weight:700;color:var(--accent);display:none;}
.theme-card.active .theme-card-check{display:block;}
.theme-preview-ring{width:100%;height:8px;background:var(--surface3);border-radius:999px;overflow:hidden;margin-top:4px;}
.theme-preview-fill{height:100%;border-radius:999px;width:68%;}


/* ===== AUTH SCREEN ===== */
#auth-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--font);}
#auth-screen.hidden{display:none;}
.auth-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px 24px 28px;display:flex;flex-direction:column;animation:slideUp .3s cubic-bezier(.4,0,.2,1);}
.auth-logo{text-align:center;font-size:40px;margin-bottom:8px;}
.auth-title{text-align:center;font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px;}
.auth-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:28px;}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.auth-field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;font-family:var(--font);font-size:15px;color:var(--text);outline:none;transition:border-color .15s;}
.auth-field input:focus{border-color:var(--accent);}
.auth-field input::placeholder{color:var(--muted);}
.auth-btn{width:100%;padding:14px;border-radius:14px;background:var(--accent);border:none;font-family:var(--font);font-size:15px;font-weight:700;color:#fff;cursor:pointer;transition:all .15s;margin-top:6px;}
.auth-btn:hover{filter:brightness(1.1);}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;}
.auth-toggle{text-align:center;font-size:13px;color:var(--muted);margin-top:16px;}
.auth-toggle a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;}
.auth-error{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);color:#ff6b6b;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px;display:none;}
.auth-error.show{display:block;}
.auth-success{background:rgba(46,213,115,.12);border:1px solid rgba(46,213,115,.3);color:#2ed573;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px;display:none;}
.auth-success.show{display:block;}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0 0;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-divider span{font-size:11px;color:var(--muted);font-weight:600;}
.auth-logout-btn{position:fixed;top:16px;right:16px;z-index:40;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px 12px;font-family:var(--font);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;display:none;}
.auth-logout-btn:hover{color:var(--text);background:var(--surface3);}
.auth-logout-btn.visible{display:block;}

</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">🎯</div>
    <div class="auth-title">Foco</div>
    <div class="auth-sub" id="auth-subtitle">Entre na sua conta</div>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-success" id="auth-success"></div>
    <div class="auth-field">
      <label>E-mail</label>
      <input type="email" id="auth-email" placeholder="seu@email.com"
             onkeydown="if(event.key==='Enter')document.getElementById('auth-pass').focus()" />
    </div>
    <div class="auth-field">
      <label>Senha</label>
      <input type="password" id="auth-pass" placeholder="••••••••"
             onkeydown="if(event.key==='Enter')Auth.submit()" />
    </div>
    <button class="auth-btn" id="auth-submit-btn" onclick="Auth.submit()">Entrar</button>
    <div id="forgot-wrap" style="text-align:center; margin-top:12px;">
      <a onclick="Auth.forgotPassword()" style="font-size:12px; color:var(--muted); cursor:pointer; text-decoration:underline;">
        Esqueceu a senha?
      </a>
    </div>
    <div class="auth-divider"><span>ou</span></div>
    <div class="auth-toggle" id="auth-toggle">
      Não tem conta? <a onclick="Auth.toggleMode()">Criar conta</a>
    </div>
  </div>
</div>
<button class="auth-logout-btn" id="logout-btn" onclick="Auth.logout()">Sair 👋</button>

<div id="app"></div>
<input type="file" id="import-file" accept=".foco,.json" style="display:none" onchange="App.handleImportFile(event)">
<script>

// =====================================================
//  SUPABASE CONFIG
// =====================================================
const SUPABASE_URL = 'https://abvqnjezezwskcjmvhhm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8jZBXMIEY3I6GtWNCNMzhA_vtDgtS1p';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// =====================================================
//  AUTH
// =====================================================
const Auth = {
  mode: 'login',

  async init() {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      this.showApp();
    }
    db.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) this.showApp();
      if (event === 'SIGNED_OUT') this.showLogin();
    });
  },

  showApp() {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('logout-btn').classList.add('visible');
    App.init();
  },

  showLogin() {
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('logout-btn').classList.remove('visible');
    document.getElementById('auth-email').value = '';
    document.getElementById('auth-pass').value = '';
    this.showError('');
    this.showSuccess('');
  },

  toggleMode() {
    this.mode = this.mode === 'login' ? 'signup' : 'login';
    const isLogin = this.mode === 'login';
    document.getElementById('auth-subtitle').textContent    = isLogin ? 'Entre na sua conta' : 'Crie sua conta';
    document.getElementById('auth-submit-btn').textContent  = isLogin ? 'Entrar' : 'Criar conta';
    document.getElementById('auth-toggle').innerHTML = isLogin
      ? 'Não tem conta? <a onclick="Auth.toggleMode()">Criar conta</a>'
      : 'Já tem conta? <a onclick="Auth.toggleMode()">Entrar</a>';
    // Esconde "Esqueceu a senha?" no modo de cadastro
    document.getElementById('forgot-wrap').style.display = isLogin ? 'block' : 'none';
    this.showError('');
    this.showSuccess('');
  },

  async forgotPassword() {
    const email = document.getElementById('auth-email').value.trim();
    if (!email) {
      this.showError('Digite seu e-mail acima para receber o link de redefinição.');
      return;
    }
    this.showError('');
    this.showSuccess('');
    try {
      const { error } = await db.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href,
      });
      if (error) throw error;
      this.showSuccess('✅ E-mail enviado! Verifique sua caixa de entrada para redefinir a senha.');
    } catch(e) {
      this.showError('Erro ao enviar e-mail: ' + e.message);
    }
  },

  async submit() {
    const email = document.getElementById('auth-email').value.trim();
    const pass  = document.getElementById('auth-pass').value;
    const btn   = document.getElementById('auth-submit-btn');

    this.showError('');
    this.showSuccess('');

    if (!email) { this.showError('Preencha o e-mail.'); return; }
    if (!pass)  { this.showError('Preencha a senha.'); return; }
    if (pass.length < 6) { this.showError('A senha precisa ter ao menos 6 caracteres.'); return; }

    btn.disabled = true;
    btn.textContent = 'Aguarde…';

    try {
      if (this.mode === 'login') {
        const { error } = await db.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
        // showApp() será chamado pelo onAuthStateChange
      } else {
        const { data, error } = await db.auth.signUp({ email, password: pass });
        if (error) throw error;

        if (data.session) {
          // Confirmação de e-mail desativada — já logou
          return;
        }
        // Confirmação de e-mail ativa
        this.showSuccess('Conta criada! Verifique seu e-mail e clique no link de confirmação.');
        this.toggleMode();
      }
    } catch(e) {
      const msgs = {
        'Invalid login credentials':                'E-mail ou senha incorretos.',
        'Email not confirmed':                      'Confirme seu e-mail antes de entrar.',
        'User already registered':                  'Este e-mail já está cadastrado. Faça login.',
        'Password should be at least 6 characters': 'Senha precisa ter ao menos 6 caracteres.',
        'Unable to validate email address: invalid format': 'E-mail inválido.',
      };
      this.showError(msgs[e.message] || ('Erro: ' + e.message));
    } finally {
      btn.disabled = false;
      btn.textContent = this.mode === 'login' ? 'Entrar' : 'Criar conta';
    }
  },

  async logout() {
    await db.auth.signOut();
  },

  showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.toggle('show', !!msg);
  },

  showSuccess(msg) {
    const el = document.getElementById('auth-success');
    el.textContent = msg;
    el.classList.toggle('show', !!msg);
  },
};

document.addEventListener('DOMContentLoaded', () => Auth.init());

const GDRIVE_FILENAME = 'foco-backup.foco';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';

const THEMES = {
  rosa:    { name:'Rosa',     desc:'Rosa suave', swatch:'linear-gradient(90deg,#ff6bb3,#ffb5e6)', fill:'linear-gradient(90deg,#ff6bb3,#ffb5e6)' },
  laranja: { name:'Laranja',  desc:'Laranja clássico', swatch:'linear-gradient(90deg,#ff9f43,#ffcc70)', fill:'linear-gradient(90deg,#ff9f43,#ffcc70)' },
  azul:    { name:'Azul',     desc:'Azul escuro em gradiente', swatch:'linear-gradient(90deg,#1d4ed8,#3b82f6,#60a5fa)', fill:'linear-gradient(90deg,#3b82f6,#60a5fa)' },
  vermelho:{ name:'Vermelho', desc:'Vermelho intenso', swatch:'linear-gradient(90deg,#dc2626,#f87171)', fill:'linear-gradient(90deg,#ef4444,#f87171)' },
  lilas:   { name:'Lilás',    desc:'Roxo lilás', swatch:'linear-gradient(90deg,#a78bfa,#ddd6fe)', fill:'linear-gradient(90deg,#c084fc,#ddd6fe)' },
};

const App = {
  state: null,
  gdriveToken: null,

  defaultState() {
    return { tasks:[], history:{}, view:'today', summaryPeriod:'daily', modal:null, wizard:null, selectedDate: null, theme:'rosa' };
  },

  loadState() {
    try {
      const saved = localStorage.getItem('foco_v2');
      this.state = saved ? JSON.parse(saved) : this.defaultState();
      if (!this.state.theme || !THEMES[this.state.theme]) this.state.theme = 'rosa';
    } catch(e) { this.state = this.defaultState(); }
  },

  save() { localStorage.setItem('foco_v2', JSON.stringify(this.state)); },

  applyTheme() {
    const t = (this.state && THEMES[this.state.theme]) ? this.state.theme : 'rosa';
    document.documentElement.setAttribute('data-theme', t);
  },

  setTheme(id) {
    if (!THEMES[id]) return;
    this.state.theme = id;
    this.applyTheme();
    this.save();
    this.render();
    this.showToast('Paleta: '+THEMES[id].name, 'success');
  },

  // ===================== HELPERS =====================
  // BUGFIX: usa data LOCAL (não UTC) para evitar virar o dia às 21h em UTC-3
  getToday() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  },

  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); },

  addDays(dateStr, n) {
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y,m-1,d);
    dt.setDate(dt.getDate()+n);
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  },

  daysDiff(a, b) {
    const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
    return Math.round((parse(b)-parse(a))/86400000);
  },

  getNow() {
    const d = new Date();
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  },

  timeToMins(t) { const [h,m]=t.split(':').map(Number); return h*60+m; },

  showToast(msg, type='') {
    const old = document.querySelector('.toast'); if (old) old.remove();
    const el = document.createElement('div'); el.className='toast '+type; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(), 2800);
  },

  // ===================== TASK LOGIC =====================
  getTaskDayData(taskId, date) {
    return (this.state.history[date]||{})[taskId] || {completed:false,progress:0};
  },
  setTaskDayData(taskId, date, data) {
    if (!this.state.history[date]) this.state.history[date]={};
    this.state.history[date][taskId] = {...this.getTaskDayData(taskId,date),...data};
  },
  getTaskGoalForDay(task, date) {
    if (task.type!=='goal') return 0;
    const idx = this.daysDiff(task.startDate,date);
    if (idx<0||idx>=task.dailyGoals.length) return 0;
    // Calcula progresso real acumulado antes de hoje para descontar overflow
    let actualBefore=0;
    for(let i=0;i<idx;i++){
      const d2=this.addDays(task.startDate,i);
      actualBefore+=(this.getTaskDayData(task.id,d2).progress||0);
    }
    const plannedEnd=task.dailyGoals.slice(0,idx+1).reduce((a,b)=>a+b,0);
    return Math.max(0, plannedEnd - actualBefore);
  },
  getWordsGoalForDay(task, date){
    if(!task.wordsDailyGoals||!task.wordsDailyGoals.length)return 0;
    const startDate=task.startDate||this.getToday();
    const idx=this.daysDiff(startDate,date);
    if(idx<0||idx>=task.wordsDailyGoals.length)return 0;
    let actualBefore=0;
    for(let i=0;i<idx;i++){
      const d2=this.addDays(startDate,i);
      actualBefore+=(this.getTaskDayData(task.id,d2).wordsProgress||0);
    }
    const plannedEnd=task.wordsDailyGoals.slice(0,idx+1).reduce((a,b)=>a+b,0);
    return Math.max(0,plannedEnd-actualBefore);
  },
  calcWordsCumulative(task, date){
    if(!task.wordsDailyGoals)return task.wordsOffset||0;
    const startDate=task.startDate||this.getToday();
    const idx=this.daysDiff(startDate,date);
    let done=task.wordsOffset||0;
    for(let i=0;i<=Math.min(idx,task.wordsDailyGoals.length-1);i++){
      const d2=this.addDays(startDate,i);
      done+=(this.getTaskDayData(task.id,d2).wordsProgress||0);
    }
    return done;
  },
  setWordsDay(i,val){
    this.state.wizard.wordsDailyGoals[i]=val;
    const totalW=parseInt(this.state.wizard.wordsTotal)||0,offsetW=parseInt(this.state.wizard.wordsOffset)||0;
    const remaining=totalW-offsetW,sum=this.state.wizard.wordsDailyGoals.reduce((a,b)=>a+b,0),diff=sum-remaining;
    const el=document.getElementById('dist-total-el');
    if(el){el.className=`dist-total ${Math.abs(diff)<=1?'ok':'over'}`;el.textContent=Math.abs(diff)<=1?'✓ Total correto: '+sum+' palavras':(diff>0?'▲ Excedendo: ':'▼ Faltando: ')+Math.abs(diff)+' palavras';}
  },
  // medalha proporcional à meta do dia
  getMedal(progress, dayGoal){
    if(!dayGoal||progress<=0)return null;
    if(progress>dayGoal)  return{cls:'platinum',icon:'💎',label:'Platinum'};
    if(progress>=dayGoal) return{cls:'ouro',    icon:'🥇',label:'Ouro'};
    if(progress>=dayGoal/2)return{cls:'prata',  icon:'🥈',label:'Prata'};
    return                       {cls:'bronze', icon:'🥉',label:'Bronze'};
  },
  getMedalRanking(year, month){
    // Retorna [{task, counts:{bronze,prata,ouro,platinum}, score}] ordenado por score
    const pad=n=>String(n).padStart(2,'0');
    const prefix=`${year}-${pad(month)}-`;
    const daysInMonth=new Date(year,month,0).getDate();
    return this.state.tasks
      .filter(t=>t.type==='goal')
      .map(t=>{
        const counts={bronze:0,prata:0,ouro:0,platinum:0};
        for(let d=1;d<=daysInMonth;d++){
          const date=`${year}-${pad(month)}-${pad(d)}`;
          const dayGoal=this.getTaskGoalForDay(t,date);
          if(!dayGoal)continue;
          const prog=(this.getTaskDayData(t.id,date).progress||0);
          const m=this.getMedal(prog,dayGoal);
          if(m)counts[m.cls]++;
        }
        const score=counts.platinum*4+counts.ouro*3+counts.prata*2+counts.bronze;
        return{task:t,counts,score};
      })
      .filter(r=>r.score>0)
      .sort((a,b)=>b.score-a.score);
  },
  isTaskActiveOnDate(task, date) {
    if (!task.active) return false;
    if (task.type==='goal') {
      const idx=this.daysDiff(task.startDate,date);
      return idx>=0&&idx<task.dailyGoals.length;
    }
    if (task.daysOfWeek) {
      const [y,m,d]=date.split('-').map(Number);
      return task.daysOfWeek.includes(new Date(y,m-1,d).getDay());
    }
    return true;
  },
  getTodayTasks() {
    return this.state.tasks.filter(t=>this.isTaskActiveOnDate(t,this.getToday()));
  },
  getDailyCompletion(date) {
    const tasks=this.state.tasks.filter(t=>this.isTaskActiveOnDate(t,date));
    if (!tasks.length) return 0;
    let pts=0;
    tasks.forEach(t=>{
      if (t.type==='simple'){
        const d=this.getTaskDayData(t.id,date);
        if (d.completed) pts++;
      } else {
        pts += this.getGoalCompletionFraction(t,date);
      }
    });
    return Math.round((pts/tasks.length)*100);
  },

  isTaskDayDone(task, date) {
    const d = this.getTaskDayData(task.id, date);
    if (task.type === 'simple') return !!d.completed;
    // For goals, only consider it done if it was explicitly finished (finishedTime or completed flag)
    return !!d.finishedTime || !!d.completed;
  },

  getGoalCompletionFraction(task, date) {
    const d = this.getTaskDayData(task.id, date);
    const goal = this.getTaskGoalForDay(task, date) || 1;
    const prog = d.progress || 0;
    if (prog >= goal) {
      // If reached goal but not marked finished, count slightly less than full to avoid counting as done
      return (d.finishedTime || d.completed) ? 1 : 0.99;
    }
    return Math.min(1, prog / goal);
  },

  // ===================== FINISH TIME =====================
  promptFinishTime(taskId, date) {
    const data = this.getTaskDayData(taskId,date);
    if (data.finishedTime) return;
    setTimeout(()=>{ this.state.modal={type:'finishTime',taskId,date}; this.render(); },300);
  },
  saveFinishTime(taskId, date, time, timeSpent) {
    const update = {};
    if (time) update.finishedTime = time;
    if (timeSpent) update.timeSpent = timeSpent;
    if (Object.keys(update).length) { this.setTaskDayData(taskId,date,update); this.save(); }
    this.closeModal(); this.render();
  },
  getBestTimeData() {
    const weekDates=this.getWeekDates();
    const hourCounts=Array(24).fill(0); let total=0;
    this.state.tasks.forEach(task=>{
      weekDates.forEach(date=>{
        const d=this.getTaskDayData(task.id,date);
        const t=d.finishedTime||d.completedAt;
        if (t&&typeof t==='string'&&t.includes(':')){
          const h=parseInt(t.split(':')[0]);
          if (h>=0&&h<24){hourCounts[h]++;total++;}
        }
      });
    });
    return {hourCounts,total};
  },
  getTimeSpentByTask() {
    // Returns array of {task, totalMins, sessions} sorted by totalMins desc
    const allDates=Object.keys(this.state.history);
    return this.state.tasks.map(task=>{
      let totalMins=0,sessions=0;
      allDates.forEach(date=>{
        const d=this.getTaskDayData(task.id,date);
        if(d.timeSpent){totalMins+=d.timeSpent;sessions++;}
      });
      return{task,totalMins,sessions};
    }).filter(x=>x.totalMins>0).sort((a,b)=>b.totalMins-a.totalMins);
  },
  fmtMins(mins){const h=Math.floor(mins/60),m=mins%60;return h>0?(h+'h'+(m>0?' '+m+'min':'')):(m+'min');},

  // ===================== STATS =====================
  getWeekDates() {
    const today=this.getToday();
    const [y,m,d]=today.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const monday=new Date(dt); monday.setDate(dt.getDate()-((dt.getDay()+6)%7));
    return Array.from({length:7},(_,i)=>{
      const dd=new Date(monday); dd.setDate(monday.getDate()+i);
      return `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
    });
  },
  getMonthDates() {
    const d=new Date(); const y=d.getFullYear(),mo=d.getMonth();
    const dim=new Date(y,mo+1,0).getDate();
    return Array.from({length:dim},(_,i)=>`${y}-${String(mo+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`);
  },
  getMissedInsights() {
    const weekDates=this.getWeekDates(), today=this.getToday();
    return this.state.tasks.filter(t=>t.active).reduce((acc,task)=>{
      let missed=0,total=0;
      weekDates.forEach(date=>{
        if (date>=today||!this.isTaskActiveOnDate(task,date)) return;
        total++;
        const d=this.getTaskDayData(task.id,date);
        if (task.type==='simple'?!d.completed:(d.progress||0)<this.getTaskGoalForDay(task,date)) missed++;
      });
      if (total>=2&&missed>=2) acc.push({task,missed,total});
      return acc;
    },[]);
  },
  getCurrentStreak() {
    let streak=0, date=this.getToday();
    for (let i=0;i<60;i++) {
      const tasks=this.state.tasks.filter(t=>this.isTaskActiveOnDate(t,date));
      if (tasks.length&&this.getDailyCompletion(date)>=80) streak++;
      else if (date<this.getToday()) break;
      date=this.addDays(date,-1);
    }
    return streak;
  },

  renderAppearance() {

          <div class="theme-card-name">${t.name}</div>
          <div class="theme-card-desc">${t.desc}</div>

    return `<div class="view">
      <div class="header">

        <div class="summary-card-title">Cores do app</div>
        <p style="font-size:13px;color:var(--muted);line-height:1.5">Ao escolher uma paleta, botões, barras, anel de %, título e destaques passam para essa cor.</p>
      </div>

  },

  // ===================== DATE NAVIGATION =====================
  getSelectedDate() {
    return this.state.selectedDate || this.getToday();
  },
  selectDate(date) {
    this.state.selectedDate = date;
    this.render();
    // Scroll selected pill into view after render
    setTimeout(() => {
      const el = document.querySelector('.date-pill.selected');
      if (el) el.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
    }, 50);
  },
  goToToday() {
    this.state.selectedDate = this.getToday();
    this.render();
    setTimeout(() => {
      const el = document.querySelector('.date-pill.selected');
      if (el) el.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
    }, 50);
  },

  renderDateStrip() {
    const today = this.getToday();
    const selected = this.getSelectedDate();
    // Show 10 days past + today + 20 future = 31 days
    const days = Array.from({length:31}, (_,i) => this.addDays(today, i-10));
    const dowShort = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

    const pills = days.map(date => {
      const [y,m,d] = date.split('-').map(Number);
      const dow = new Date(y,m-1,d).getDay();
      const dayNum = d;
      const isToday = date === today;
      const isSel = date === selected;
      const isFuture = date > today;
      const tasks = this.state.tasks.filter(t => this.isTaskActiveOnDate(t, date));
      let dotHtml = '';
      if (!isFuture && tasks.length > 0) {
        const pct = this.getDailyCompletion(date);
        const color = pct >= 80 ? 'green' : pct >= 40 ? 'orange' : 'red';
        dotHtml = `<div class="dp-dot ${color}"></div>`;
      } else if (isFuture && tasks.length > 0) {
        dotHtml = `<div class="dp-dot future"></div>`;
      }
      return `<div class="date-pill ${isSel?'selected':''} ${isToday&&!isSel?'is-today':''}" onclick="App.selectDate('${date}')">
        <div class="dp-dow">${isToday && !isSel ? 'Hoje' : dowShort[dow]}</div>
        <div class="dp-num">${dayNum}</div>
        <div class="dp-dot-row">${dotHtml}</div>
      </div>`;
    }).join('');

    return `<div class="date-strip-wrap">
      <div class="date-strip" id="date-strip">${pills}</div>
    </div>`;
  },

  // ===================== TODAY VIEW =====================
  renderToday() {
    const today = this.getToday();
    const date = this.getSelectedDate();
    const isFuture = date > today;
    const isPast = date < today;
    const isToday = date === today;

    const tasks = this.state.tasks.filter(t => this.isTaskActiveOnDate(t, date));
    const pct = isToday || isPast ? this.getDailyCompletion(date) : this.calcFutureProgress(date, tasks);
    const done = tasks.filter(t => {
      const d = this.getTaskDayData(t.id, date);
      return t.type==='simple' ? d.completed : (d.progress||0) >= (this.getTaskGoalForDay(t,date)||1);
    }).length;

    const C = 2*Math.PI*52, offset = C - (pct/100)*C;
    const [y,m,d] = date.split('-').map(Number);
    const dtObj = new Date(y,m-1,d);
    const dateLabel = dtObj.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});

    // Ring color: future = purple, past = muted, today = accent
    const ringFutureCls = isFuture ? 'ring-future' : '';
    const ringLabel = isFuture ? 'planejado' : 'concluído';

    return `<div class="view" id="today-view">
      <div class="header">
        <div class="header-left">
          <h1>Foco<span>.</span></h1>
          <p>${isToday ? dateLabel : dateLabel + (isFuture?' · prévia':' · histórico')}</p>
        </div>
        <div class="header-btns">
          ${this.getMissedInsights().length>0 && isToday ? `<div class="header-btn" onclick="App.openInsights()">💡</div>` : ''}
          ${!isToday ? `<div class="header-btn" onclick="App.goToToday()" title="Ir para hoje" style="font-size:13px;font-weight:700;color:var(--accent)">Hoje</div>` : ''}
        </div>
      </div>

      ${this.renderDateStrip()}

      <div class="ring-section">
        <div class="ring-wrap">
          <svg width="140" height="140" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52"/>
            <circle class="ring-fill ${ringFutureCls}" cx="60" cy="60" r="52"
              stroke-dasharray="${C}" stroke-dashoffset="${offset}"
              style="${pct===0?'opacity:0':''}"/>
          </svg>
          <div class="ring-center">
            <div class="ring-pct ${ringFutureCls}">${isFuture ? tasks.length + '<br><span style="font-size:14px;font-weight:600">tarefas</span>' : pct+'%'}</div>
            ${!isFuture ? `<div class="ring-label">${ringLabel}</div>` : ''}
          </div>
        </div>
        <div class="ring-meta">
          ${isFuture
            ? `<b>${tasks.length}</b> tarefa${tasks.length!==1?'s':''} planejada${tasks.length!==1?'s':''}`
            : `<b>${done}</b> de <b>${tasks.length}</b> tarefa${tasks.length!==1?'s':''}`}
        </div>
      </div>

      ${this.renderDayBanner(date, today, isFuture, isPast, tasks)}
      ${this.renderDayTasks(tasks, date, isFuture, isPast)}
    </div>`;
  },

  calcFutureProgress(date, tasks) {
    // For future: show % of tasks that have goals defined (always 0 actual progress)
    return 0;
  },

  renderDayBanner(date, today, isFuture, isPast, tasks) {
    if (!isFuture && !isPast) return '';
    const [y,m,d] = date.split('-').map(Number);
    const dtObj = new Date(y,m-1,d);
    const dateStr = dtObj.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'});
    if (isFuture) {
      const goalSummary = tasks
        .filter(t => t.type === 'goal')
        .map(t => `${this.getTaskGoalForDay(t,date)} ${t.goalUnit}`)
        .join(' · ');
      return `<div class="day-banner future">
        <span class="day-banner-icon">🔭</span>
        <div>
          <b>Prévia — ${dateStr}</b>
          ${goalSummary ? `<div style="font-size:11px;margin-top:2px;color:var(--accent2);opacity:.8">${goalSummary}</div>` : ''}
        </div>
      </div>`;
    } else {
      const pct = this.getDailyCompletion(date);
      const icon = pct >= 80 ? '✅' : pct >= 40 ? '📊' : '❌';
      return `<div class="day-banner past">
        <span class="day-banner-icon">${icon}</span>
        <div><b>${dateStr}</b><span style="margin-left:8px;color:${pct>=80?'var(--green)':pct>=40?'var(--accent)':'var(--red)'}">${pct}% concluído</span></div>
      </div>`;
    }
  },

  renderDayTasks(tasks, date, isFuture, isPast) {
    if (!tasks.length) {
      return `<div class="empty-state"><div class="emoji">${isFuture?'📅':'✨'}</div>
        <p>${isFuture?'Nenhuma tarefa planejada<br>para este dia.':'Nenhuma tarefa neste dia.'}</p></div>`;
    }
    const nowMins = this.timeToMins(this.getNow());

    if (isFuture) {
      // Future: read-only preview grouped by type
      const goalTasks = tasks.filter(t => t.type === 'goal');
      const simpleTasks = tasks.filter(t => t.type === 'simple');
      let html = '';
      if (goalTasks.length) {
        html += `<div class="section-badge"><div class="section-badge-dot" style="background:var(--accent2)"></div>Metas do dia</div>
          <div class="tasks-list">`;
        goalTasks.forEach(t => { html += this.renderFutureGoalCard(t, date); });
        html += `</div>`;
      }
      if (simpleTasks.length) {
        html += `<div class="section-badge" style="margin-top:${goalTasks.length?16:0}px;"><div class="section-badge-dot" style="background:var(--muted)"></div>Tarefas simples</div>
          <div class="tasks-list">`;
        simpleTasks.forEach(t => { html += this.renderFutureSimpleCard(t, date); });
        html += `</div>`;
      }
      return html;
    }

    // Past or today: same interactive cards
    const today = this.getToday();
    const pending = tasks.filter(t => !this.isTaskDayDone(t,date));
    const doneList = tasks.filter(t => this.isTaskDayDone(t,date));
    let html = '';
    if (pending.length) {
      html += `<div class="section-badge"><div class="section-badge-dot"></div>${isPast?'Não concluídas':'Pendentes'} (${pending.length})</div><div class="tasks-list">`;
      pending.forEach(t => { html += this.renderTaskCard(t, date, nowMins); });
      html += `</div>`;
    }
    if (doneList.length) {
      html += `<div class="section-badge" style="margin-top:${pending.length?16:0}px;"><div class="section-badge-dot" style="background:var(--green)"></div>Concluídas (${doneList.length})</div><div class="tasks-list">`;
      doneList.forEach(t => { html += this.renderTaskCard(t, date, nowMins); });
      html += `</div>`;
    }
    return html;
  },

  renderFutureGoalCard(task, date) {
    const goal = this.getTaskGoalForDay(task, date);
    const idx = this.daysDiff(task.startDate, date);
    const startOffset = task.startOffset||0;
    const totalBook = task.totalBook||task.dailyGoals.reduce((a,b)=>a+b,0)+startOffset;
    const totalDays = task.dailyGoals.length;
    // Cumulative pages read up to and including this day (absolute)
    const cumulativeThisDay = startOffset + task.dailyGoals.slice(0, idx+1).reduce((a,b)=>a+b,0);
    const absStart = startOffset + task.dailyGoals.slice(0,idx).reduce((a,b)=>a+b,0) + 1;
    const absEnd = absStart + goal - 1;
    const globalPct = Math.round((cumulativeThisDay/totalBook)*100);
    return `<div class="task-card goal-card preview" style="cursor:default">
      <div class="task-body">
        <div class="task-name">${task.name}</div>
        <div class="task-sub">
          <span class="chip orange">Dia ${idx+1}/${totalDays}</span>
          ${task.schedule==='fixed'?`<span class="task-time-badge">⏰ ${task.scheduledTime}</span>`:`<span class="task-time-badge">🔄 Flexível</span>`}
          ${task.goalUnit!=='min'?`<span class="task-time-badge" style="background:var(--surface3)">📖 ${absStart}–${absEnd}</span>`:''}
        </div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px;">
          <div>
            <div class="goal-preview-amount">${goal}</div>
            <div class="goal-preview-unit">${task.goalUnit} neste dia</div>
          </div>
          <div style="text-align:right">
            <div class="goal-total-pill">📚 ${cumulativeThisDay}/${totalBook} ${task.goalUnit} acumulado</div>
          </div>
        </div>
        <div style="margin-top:10px;">
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px">
            <span>Progresso geral do livro ao fim do dia</span><span style="color:var(--accent)">${globalPct}%</span>
          </div>
          <div class="goal-bar"><div class="goal-bar-fill" style="width:${globalPct}%"></div></div>
          <div style="font-size:10px;color:var(--muted);margin-top:3px;text-align:right">dia ${idx+1} de ${totalDays}</div>
        </div>
      </div>
    </div>`;
  },

  renderFutureSimpleCard(task, date) {
    return `<div class="task-card preview" style="cursor:default">
      <div class="check-btn" style="opacity:.35;cursor:default;border-color:var(--surface3)"></div>
      <div class="task-body">
        <div class="task-name">${task.name}</div>
        <div class="task-sub">
          ${task.schedule==='fixed'?`<span class="task-time-badge">⏰ ${task.scheduledTime}</span>`:`<span class="task-time-badge">🔄 Flexível</span>`}
        </div>
      </div>
    </div>`;
  },

  renderTodayTasks(tasks,today) {
    return this.renderDayTasks(tasks, today, false, false);
  },

  renderTaskCard(task,date,nowMins) {
    const data=this.getTaskDayData(task.id,date);
    const isToday=date===this.getToday();
    if (task.type==='simple') {
      const checked=data.completed;
      let timeBadge='',overdueClass='';
      if (task.schedule==='fixed'&&task.scheduledTime) {
        const isLate=isToday&&!checked&&nowMins>this.timeToMins(task.scheduledTime)+15;
        overdueClass=isLate?'overdue':'';
        timeBadge=`<span class="task-time-badge ${isLate?'late':''}">⏰ ${task.scheduledTime}</span>`;
      } else {
        timeBadge=`<span class="task-time-badge">🔄 Flexível</span>`;
      }
      const ftBadge=data.finishedTime?`<span class="done-time-chip">✓ ${data.finishedTime}</span>`:'';
      const hasMinutes=!!(task.dailyMinutes>0);
      const hasWords=!!(task.wordsDailyGoals&&task.wordsDailyGoals.length);
      const minutesDone=data.timeSpent||0;
      const minutesPct=hasMinutes?Math.min(100,Math.round(minutesDone/task.dailyMinutes*100)):0;
      const wordsGoalToday=hasWords?this.getWordsGoalForDay(task,date):0;
      const wordsDone=data.wordsProgress||0;
      const wordsPct=wordsGoalToday>0?Math.min(100,Math.round(wordsDone/wordsGoalToday*100)):0;
      const wordsCumulative=hasWords?this.calcWordsCumulative(task,date):0;
      return `<div class="task-card ${checked?'done':''} ${overdueClass}">
        <div class="check-btn ${checked?'checked':''}" onclick="App.toggleTask('${task.id}','${date}')">
          ${checked?'✓':''}
        </div>
        <div class="task-body" onclick="App.openTaskDetail('${task.id}')" style="cursor:pointer">
          <div class="task-name">${task.name}</div>
          <div class="task-sub">${timeBadge}${ftBadge}</div>
          ${(hasMinutes||hasWords)?`
          <div class="goal-bar-wrap" style="margin-top:8px">
            ${hasMinutes?`
            <div class="goal-bar-top">
              <span>⏱ ${minutesDone}/${task.dailyMinutes} min</span>
              <span style="color:var(--muted);font-size:10px"><b style="color:var(--accent)">${minutesPct}%</b></span>
            </div>
            <div class="goal-bar"><div class="goal-bar-fill ${minutesPct>=100?'full':''}" style="width:${minutesPct}%"></div></div>`:''}
            ${hasWords?`
            <div class="goal-bar-top" ${hasMinutes?'style="margin-top:8px"':''}>
              <span>📝 ${wordsDone}/${wordsGoalToday} palavras hoje</span>
              <span style="color:var(--muted);font-size:10px">${wordsCumulative}/${task.wordsTotal} total · <b style="color:var(--accent2)">${wordsPct}%</b></span>
            </div>
            <div class="goal-bar"><div class="goal-bar-fill ${wordsPct>=100?'full':''}" style="width:${wordsPct}%;background:var(--accent2)"></div></div>`:''}
          </div>`:''}
          <div class="tap-hint">ℹ️ Ver detalhes e histórico</div>
        </div>
        <div class="task-right">
          ${checked?`<button class="revert-btn" onclick="event.stopPropagation();App.revertTask('${task.id}','${date}')">↩ Reverter</button>`:hasWords?`<button class="log-btn" onclick="event.stopPropagation();App.openLogWords('${task.id}')">+ Palavras</button>`:''}
        </div>
      </div>`;
    } else {
      const goal=this.getTaskGoalForDay(task,date),progress=data.progress||0;
      const pct=goal>0?Math.min(100,Math.round((progress/goal)*100)):0;
      const isFull=pct>=100 && (data.finishedTime || data.completed);
      const idx=this.daysDiff(task.startDate,date);
      const ftBadge=data.finishedTime&&pct>=100?`<span class="done-time-chip">✓ ${data.finishedTime}</span>`:'';
      const timeSpentBadge=data.timeSpent&&isFull?`<span class="done-time-chip" style="background:rgba(139,124,246,.12);color:var(--accent2);border-color:rgba(139,124,246,.25)">⏱ ${data.timeSpent>=60?(Math.floor(data.timeSpent/60)+'h'+(data.timeSpent%60>0?data.timeSpent%60+'min':'')):data.timeSpent+'min'}</span>`:'';

      // startOffset: pages already done before the task was created
      const startOffset=task.startOffset||0;
      const totalBook=task.totalBook||task.dailyGoals.reduce((a,b)=>a+b,0)+startOffset;

      // Cumulative done in previous days of THIS task (not counting offset)
      let cumDaysBefore=0;
      for(let i=0;i<idx;i++){
        const d2=this.addDays(task.startDate,i);
        const dd=this.getTaskDayData(task.id,d2);
        cumDaysBefore+=(dd.progress||0);
      }
      // Absolute position range for today's goal
      const absRangeStart=startOffset+cumDaysBefore+1;
      const absRangeEnd=startOffset+cumDaysBefore+goal;
      const rangeLabel=`📖 ${absRangeStart}–${absRangeEnd}`;

      // Global progress bar: totalRead (offset + all days done) / totalBook
      const totalReadSoFar=startOffset+cumDaysBefore+progress;
      const globalPct=totalBook>0?Math.min(100,Math.round((totalReadSoFar/totalBook)*100)):pct;
      const globalPctDisplay=totalBook>0?globalPct:pct;
      const displayPct = isFull ? 100 : pct;

      // Toggle de exibição: páginas ou capítulo
      if(!this.state.barModes)this.state.barModes={};
      const barMode=this.state.barModes[task.id]||'pages';
      const cp=task.chapterPages;
      const hasChapters=cp&&cp.length>0;
      // Capítulo atual baseado em totalReadSoFar
      let curChapNum=null,totalChaps=null;
      if(hasChapters){
        totalChaps=cp.length;
        curChapNum=1;
        for(let j=0;j<cp.length;j++){if(cp[j]>0&&cp[j]<=totalReadSoFar)curChapNum=j+1;}
      }
      const barLabel=(!hasChapters||barMode==='pages')
        ?`${totalReadSoFar}/${totalBook} ${task.goalUnit}`
        :`Cap. ${curChapNum}/${totalChaps}`;
      const barToggle=hasChapters?` onclick="event.stopPropagation();App.toggleBarMode('${task.id}')" style="cursor:pointer;user-select:none" title="Clique para alternar"`:'';
      const medal=this.getMedal(progress,goal);
      const medalBadge=medal?`<span class="medal-badge ${medal.cls}">${medal.icon} ${medal.label}</span>`:'';

      return `<div class="task-card goal-card ${isFull?'done':''}">
        <div class="task-body" onclick="App.openTaskDetail('${task.id}')" style="cursor:pointer">
          <div class="task-name">${task.name}</div>
          <div class="task-sub">
            <span class="chip ${isFull?'green':'orange'}">Dia ${idx+1}/${task.dailyGoals.length}</span>
            ${task.schedule==='fixed'?`<span class="task-time-badge">⏰ ${task.scheduledTime}</span>`:`<span class="task-time-badge">🔄 Flexível</span>`}
            ${task.goalUnit!=='min'?`<span class="task-time-badge" style="background:var(--surface3)">${rangeLabel} ${task.goalUnit}</span>`:''}
            ${medalBadge}${ftBadge}${timeSpentBadge}
          </div>
          <div class="goal-bar-wrap">
            <div class="goal-bar-top">
              <span>${progress} / ${goal} ${task.goalUnit} hoje</span>
              <span style="color:var(--muted);font-size:10px"${barToggle}>${barLabel}${barToggle?` <span style="font-size:9px;opacity:.5">↕</span>`:''} · <b style="color:var(--accent)">${displayPct}%</b></span>
            </div>
            <div class="goal-bar"><div class="goal-bar-fill ${displayPct>=100?'full':''}" style="width:${displayPct}%"></div></div>
          </div>
          <div class="tap-hint">ℹ️ Ver datas, calendário e atrasos</div>
        </div>
        <div class="task-right">
          ${!isFull?`<button class="log-btn" onclick="App.openLogProgress('${task.id}')">+ Registrar</button>`:`<button class="revert-btn" onclick="event.stopPropagation();App.revertTask('${task.id}','${date}')">↩ Reverter</button>`}
        </div>
      </div>`;
    }
  },

  toggleTask(taskId,date) {
    const data=this.getTaskDayData(taskId,date);
    const wasCompleted=data.completed;
    this.setTaskDayData(taskId,date,{
      completed:!wasCompleted,
      completedAt:!wasCompleted?this.getNow():null,
      finishedTime:wasCompleted?null:data.finishedTime
    });
    this.save();
    if (!wasCompleted) this.promptFinishTime(taskId,date);
    else this.render();
  },

  revertTask(taskId,date) {
    const task = this.state.tasks.find(t=>t.id===taskId);
    const reset = {
      completed: false,
      completedAt: null,
      finishedTime: null,
      progress: 0,
      wordsProgress: 0,
      altProgress: null,
      timeSpent: null,
    };
    this.setTaskDayData(taskId,date,reset);
    // Debug: log state after revert to diagnose pct mismatch
    const d = this.getTaskDayData(taskId,date);
    const goalFrac = task && task.type==='goal' ? this.getGoalCompletionFraction(task,date) : (d.completed?1:0);
    console.log('revertTask ->', {taskId,date,data:d,goalFrac, dailyPct:this.getDailyCompletion(date)});
    // Ensure any modal (finishTime, etc.) is closed when reverting
    this.state.modal = null;
    this.state.wizard = null;
    this.save();
    this.render();
    this.showToast('Tarefa revertida', 'success');
  },

  // ===================== SUMMARY =====================
  renderSummary() {
    const p=this.state.summaryPeriod;
    return `<div class="view">
      <div class="header">
        <div class="header-left"><h1>Resumo<span>.</span></h1><p>Acompanhamento de progresso</p></div>
      </div>
      <div class="period-tabs">
        ${['daily','weekly','monthly'].map(v=>`<button class="period-tab ${p===v?'active':''}" onclick="App.setPeriod('${v}')">${{daily:'Hoje',weekly:'Semana',monthly:'Mês'}[v]}</button>`).join('')}
      </div>
      ${p==='daily'?this.renderDailySummary():p==='weekly'?this.renderWeeklySummary():this.renderMonthlySummary()}
    </div>`;
  },
  setPeriod(p){this.state.summaryPeriod=p;this.render();},

  renderDailySummary() {
    const today=this.getToday();
    const tasks=this.state.tasks.filter(t=>this.isTaskActiveOnDate(t,today));
    const pct=this.getDailyCompletion(today);
    const goalTasks=tasks.filter(t=>t.type==='goal');
    return `
      <div class="summary-card">
        <div class="summary-card-title">📅 Hoje</div>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-val">${pct}%</div><div class="stat-lbl">Concluído</div></div>
          <div class="stat-box"><div class="stat-val">${tasks.length}</div><div class="stat-lbl">Tarefas</div></div>
          <div class="stat-box"><div class="stat-val">${tasks.filter(t=>this.isTaskDayDone(t,today)).length}</div><div class="stat-lbl">Feitas</div></div>
        </div>
      </div>
      ${goalTasks.length?`<div class="summary-card">
        <div class="summary-card-title">🎯 Metas do dia</div>
        ${goalTasks.map(t=>{const d=this.getTaskDayData(t.id,today);const g=this.getTaskGoalForDay(t,today);const p2=d.progress||0;
          return `<div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><b>${t.name}</b><span style="color:var(--accent)">${p2}/${g} ${t.goalUnit}</span></div>
            <div class="goal-bar"><div class="goal-bar-fill ${p2>=g?'full':''}" style="width:${g>0?Math.min(100,Math.round(p2/g*100)):0}%"></div></div>
          </div>`;}).join('')}
      </div>`:''}`;
  },

  renderWeeklySummary() {
    const dates=this.getWeekDates(),today=this.getToday();
    const dayLabels=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    const completions=dates.map(d=>this.getDailyCompletion(d));
    const avg=completions.reduce((a,b)=>a+b,0)/7;
    const maxPct=Math.max(...completions,1);
    const insights=this.getMissedInsights();
    const {hourCounts,total}=this.getBestTimeData();
    const maxHour=Math.max(...hourCounts,1);
    const peakHour=hourCounts.indexOf(Math.max(...hourCounts));
    const hoursToShow=Array.from({length:19},(_,i)=>i+5);
    return `
      <div class="summary-card">
        <div class="summary-card-title">📈 Esta semana</div>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-val">${Math.round(avg)}%</div><div class="stat-lbl">Média</div></div>
          <div class="stat-box"><div class="stat-val">${Math.max(...completions)}%</div><div class="stat-lbl">Melhor dia</div></div>
          <div class="stat-box"><div class="stat-val">${completions.filter(v=>v>=80).length}</div><div class="stat-lbl">Dias 80%+</div></div>
        </div>
        <div class="day-bar-chart" style="margin-top:16px;">
          ${dates.map((d,i)=>{const pct=completions[i],isFuture=d>today,isToday=d===today;const h=isFuture?4:Math.max(4,Math.round((pct/maxPct)*60));
            return `<div class="day-bar-col">
              <div class="day-bar-pct">${isFuture?'':pct+'%'}</div>
              <div class="day-bar ${pct>0&&!isFuture?'filled':''}" style="height:${h}px;${isToday?'background:var(--accent2)':''}"></div>
              <div class="day-bar-label" style="${isToday?'color:var(--text)':''}">${dayLabels[i]}</div>
            </div>`;}).join('')}
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-card-title">⏰ Melhor horário para concluir</div>
        ${total===0?`<div style="font-size:13px;color:var(--muted);text-align:center;padding:12px 0">
            Ao concluir tarefas, o app vai perguntar o horário.<br>
            <span style="font-size:11px">Com dados suficientes, seu pico de produtividade aparece aqui.</span></div>`:`
          <div style="font-size:13px;color:var(--muted);margin-bottom:8px">
            Pico: <b style="color:var(--accent)">${peakHour}h–${peakHour+1}h</b> (${hourCounts[peakHour]} conclusão${hourCounts[peakHour]!==1?'ões':''})
          </div>
          <div class="hour-bar-wrap">
            ${hoursToShow.map(h=>{const count=hourCounts[h];const hPct=Math.max(4,Math.round((count/maxHour)*48));const isPeak=h===peakHour&&count>0;
              return `<div class="hour-col">
                <div class="hour-bar ${count>0?'has-data':''} ${isPeak?'peak':''}" style="height:${hPct}px"></div>
                ${h%3===0?`<div class="hour-tick">${h}h</div>`:'<div class="hour-tick"></div>'}
              </div>`;}).join('')}
          </div>`}
      </div>
      ${insights.length?`<div class="summary-card">
        <div class="summary-card-title">💡 Sugestões</div>
        ${insights.map(({task,missed,total})=>`
          <div class="insight-item">
            <span class="insight-icon">⚠️</span>
            <div><div class="insight-text"><span>${task.name}</span> não concluída em ${missed} de ${total} dias.</div>
            <div class="insight-action"><button onclick="App.openSuggestion('${task.id}')">Ver opções</button></div></div>
          </div>`).join('')}
      </div>`:``}
      ${(()=>{const tsd=this.getTimeSpentByTask();if(!tsd.length)return'';const maxM=tsd[0].totalMins;return`<div class="summary-card">
        <div class="summary-card-title">⏱️ Tempo por matéria (total registrado)</div>
        ${tsd.map(({task,totalMins,sessions})=>{const pct=Math.round((totalMins/maxM)*100);return`<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <b>${task.name}</b>
            <span style="color:var(--accent)">${this.fmtMins(totalMins)}</span>
          </div>
          <div class="goal-bar"><div class="goal-bar-fill" style="width:${pct}%;background:var(--accent2)"></div></div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${sessions} sessão${sessions!==1?'ões':''} · média ${this.fmtMins(Math.round(totalMins/sessions))}/sessão</div>
        </div>`;}).join('')}
      </div>`;})()} `;
  },

  renderMonthlySummary() {
    const dates=this.getMonthDates(),today=this.getToday();
    const pastDates=dates.filter(d=>d<=today);
    const completions=pastDates.map(d=>this.getDailyCompletion(d));
    const avg=completions.length?completions.reduce((a,b)=>a+b,0)/completions.length:0;
    const best=completions.length?Math.max(...completions):0;
    const [y,m]=today.split('-').map(Number);
    const monthName=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    return `
      <div class="summary-card">
        <div class="summary-card-title">🗓️ ${monthName}</div>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-val">${Math.round(avg)}%</div><div class="stat-lbl">Média</div></div>
          <div class="stat-box"><div class="stat-val">${best}%</div><div class="stat-lbl">Melhor dia</div></div>
          <div class="stat-box"><div class="stat-val">${this.getCurrentStreak()}</div><div class="stat-lbl">Sequência</div></div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-card-title">📅 Calendário</div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">
          ${['D','S','T','Q','Q','S','S'].map(d=>`<div style="text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding:4px 0">${d}</div>`).join('')}
          ${this.renderMonthCalendar(dates,today)}
        </div>
      </div>`;
  },
  renderMonthCalendar(dates,today) {
    const [y,m,d]=dates[0].split('-').map(Number);
    const firstDow=new Date(y,m-1,d).getDay();
    let html=Array(firstDow).fill('<div></div>').join('');
    dates.forEach(date=>{
      const isFuture=date>today,pct=isFuture?-1:this.getDailyCompletion(date),isToday=date===today;
      const day=parseInt(date.split('-')[2]);
      let bg='var(--surface2)',color='var(--muted)';
      if (!isFuture&&pct>=80){bg='rgba(46,213,115,.25)';color='var(--green)';}
      else if (!isFuture&&pct>=50){bg='color-mix(in srgb, var(--accent) 20%, transparent)';color='var(--accent)';}
      else if (!isFuture&&pct>0){bg='rgba(255,107,107,.15)';color='var(--red)';}
      html+=`<div style="text-align:center;background:${bg};color:${color};border-radius:8px;padding:5px 2px;font-size:11px;font-weight:700;border:2px solid ${isToday?'var(--accent)':'transparent'}">${day}</div>`;
    });
    return html;
  },

  // ===================== MANAGE =====================
  renderManage() {
    const tasks=this.state.tasks;
    return `<div class="view">
      <div class="header">
        <div class="header-left"><h1>Tarefas<span>.</span></h1><p>${tasks.length} tarefa${tasks.length!==1?'s':''} cadastrada${tasks.length!==1?'s':''}</p></div>
        <button class="header-btn" onclick="App.openAddTask()" style="background:var(--accent);border-color:var(--accent);color:#fff;font-size:20px;font-weight:700;">+</button>
      </div>
      ${!tasks.length?`<div class="empty-state"><div class="emoji">📝</div><p>Nenhuma tarefa ainda.</p></div>`:''}
      ${tasks.map(t=>this.renderManageItem(t)).join('')}
    </div>`;
  },
  renderManageItem(task) {
    const meta=task.type==='goal'
      ?`🎯 ${task.dailyGoals.reduce((a,b)=>a+b,0)} ${task.goalUnit} em ${task.dailyGoals.length} dias`
      :`${task.schedule==='fixed'?'⏰ '+task.scheduledTime:'🔄 Flexível'} · ${task.daysOfWeek&&task.daysOfWeek.length<7?task.daysOfWeek.length+'x/sem':'Diária'}`;
    return `<div class="manage-task-item">
      <div style="font-size:22px">${task.type==='goal'?'🎯':'✅'}</div>
      <div class="manage-task-info"><div class="manage-task-name">${task.name}</div><div class="manage-task-meta">${meta}</div></div>
      <div class="manage-actions">
        <div class="manage-btn" onclick="App.openEditTask('${task.id}')">✏️</div>
        <div class="manage-btn del" onclick="App.deleteTask('${task.id}')">🗑️</div>
      </div>
    </div>`;
  },
  deleteTask(taskId) {
    if (!confirm('Remover esta tarefa?')) return;
    this.state.tasks=this.state.tasks.filter(t=>t.id!==taskId); this.save(); this.render();
  },

        <div style="font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin:16px 0 8px">📁 Arquivo local</div>
        <div class="sync-option" onclick="App.exportFile()">
          <div class="sync-icon-wrap" style="background:color-mix(in srgb,var(--accent) 10%,transparent)">⬇️</div>
          <div class="sync-option-info"><div class="sync-option-title">Exportar .foco</div><div class="sync-option-sub">Baixa arquivo com todos os dados</div></div>

          <div class="sync-icon-wrap" style="background:rgba(139,124,246,.1)">⬆️</div>
