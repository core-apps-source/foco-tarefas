  importData(jsonStr) {
    const parsed=JSON.parse(jsonStr);
    if (!parsed.tasks&&!parsed.history) throw new Error('Invalid');
    // Merge tasks (union by id)
    const existingIds=new Set(this.state.tasks.map(t=>t.id));
    const newTasks=[...this.state.tasks];
    (parsed.tasks||[]).forEach(t=>{if(!existingIds.has(t.id))newTasks.push(t);});
    // Merge history
    const mergedHistory={...this.state.history};
    Object.entries(parsed.history||{}).forEach(([date,entries])=>{
      mergedHistory[date]={...(mergedHistory[date]||{}),...entries};
    });
    this.state.tasks=newTasks; this.state.history=mergedHistory;
    this.save();
    localStorage.setItem('foco_last_sync',Date.now().toString());
    this.closeModal(); this.render();
    this.showToast('✅ Dados importados!','success');

        </div>

  saveGdriveClientId() {
    const el=document.getElementById('gdrive-client-id');
    if (!el||!el.value.trim()){this.showToast('Cole o Client ID','error');return;}
    localStorage.setItem('foco_gdrive_client_id',el.value.trim()); location.reload();
  },
  gdriveAuth() {
    const clientId=localStorage.getItem('foco_gdrive_client_id');
    if (!clientId){this.openGdriveSetup();return;}
    if (this.gdriveToken){this.openSync();return;}
    const params=new URLSearchParams({client_id:clientId,redirect_uri:location.origin+location.pathname,response_type:'token',scope:GDRIVE_SCOPE,include_granted_scopes:'true'});
    const popup=window.open(`https://accounts.google.com/o/oauth2/v2/auth?${params}`,'gauth','width=500,height=600');
    const check=setInterval(()=>{
      try{
        if (!popup||popup.closed){clearInterval(check);return;}
        const hash=popup.location.hash;
        if (hash){
          const p=new URLSearchParams(hash.slice(1));const token=p.get('access_token');
          if (token){this.gdriveToken=token;popup.close();clearInterval(check);this.showToast('✅ Drive conectado!','success');this.closeModal();this.render();}
        }
      }catch(e){}
    },500);
  },
  async gdriveSave() {
    if (!this.gdriveToken){this.showToast('Conecte o Drive primeiro','error');return;}
    this.showToast('⏳ Salvando...','');
    try{
      const data=JSON.stringify(this.getExportData(),null,2);
      const searchRes=await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${GDRIVE_FILENAME}'&fields=files(id)`,{headers:{Authorization:`Bearer ${this.gdriveToken}`}});
      const sj=await searchRes.json(); const existingId=sj.files?.[0]?.id;
      const meta={name:GDRIVE_FILENAME,mimeType:'application/json',...(existingId?{}:{parents:['appDataFolder']})};
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
      form.append('file',new Blob([data],{type:'application/json'}));
      const url=existingId?`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`:`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
      const res=await fetch(url,{method:existingId?'PATCH':'POST',headers:{Authorization:`Bearer ${this.gdriveToken}`},body:form});
      if (res.ok){localStorage.setItem('foco_last_sync',Date.now().toString());this.showToast('✅ Salvo no Drive!','success');this.closeModal();this.render();}
      else throw new Error(await res.text());
    }catch(e){this.showToast('❌ Erro: '+e.message,'error');}
  },
  async gdriveLoad() {
    if (!this.gdriveToken){this.showToast('Conecte o Drive primeiro','error');return;}
    this.showToast('⏳ Carregando...','');
    try{
      const searchRes=await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${GDRIVE_FILENAME}'&fields=files(id)`,{headers:{Authorization:`Bearer ${this.gdriveToken}`}});
      const sj=await searchRes.json(); const file=sj.files?.[0];
      if (!file){this.showToast('Nenhum backup encontrado','error');return;}
      const fileRes=await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,{headers:{Authorization:`Bearer ${this.gdriveToken}`}});
      this.importData(await fileRes.text());
      localStorage.setItem('foco_last_sync',Date.now().toString());
    }catch(e){this.showToast('❌ Erro: '+e.message,'error');}
  },

  wizardSave(){
    const w=this.state.wizard,today=this.getToday();
    let dailyGoals=[];
    const offset=parseInt(w.startOffset)||0;
    if(w.type==='goal'){
      const totalBook=parseInt(w.totalGoal);
      const remaining=totalBook-offset; // pages left to read
      const days=parseInt(w.daysToComplete);
      if(w.distribution==='custom'&&w.dailyGoals.length===days){
        dailyGoals=w.dailyGoals.map(Number);
      } else {
        const eq=Math.floor(remaining/days),rem=remaining-eq*(days-1);
        dailyGoals=Array.from({length:days},(_,i)=>i===days-1?rem:eq);
      }
    }
    if(w.editId){
      const task=this.state.tasks.find(t=>t.id===w.editId);
      if(task){
        Object.assign(task,{name:w.name.trim(),type:w.type,schedule:w.schedule,scheduledTime:w.schedule==='fixed'?w.scheduledTime:null,daysOfWeek:w.daysOfWeek});
        if(w.type==='goal'){          Object.assign(task,{goalUnit:w.goalUnit,dailyGoals,startDate:task.startDate||today,totalBook:parseInt(w.totalGoal),startOffset:offset});
          // Salva chapterPages e monta unitConversions para conversão por página
          if(w.chapterPages&&w.chapterPages.length>0&&parseInt(w.numChapters)>0){
            const cp=w.chapterPages.map(v=>parseInt(v)||0);
            task.chapterPages=cp;
            const filled=cp.filter(v=>v>0);
            if(filled.length>1){
              const avgPages=Math.round(((Math.max(...filled)-Math.min(...filled))/(filled.length-1))*10)/10;
              if(!task.unitConversions)task.unitConversions={};
              task.unitConversions['páginas']=avgPages>0?avgPages:1;
            }
          }
        } else if(w.type==='simple'){
          task.dailyMinutes=parseInt(w.dailyMinutes)||0;
          if(w.wordsEnabled&&parseInt(w.wordsTotal)>0&&parseInt(w.wordsDays)>0){
            const totalW=parseInt(w.wordsTotal),offsetW=parseInt(w.wordsOffset)||0;
            const remainingW=totalW-offsetW,days=parseInt(w.wordsDays);
            let wdg;
            if(w.wordsDistribution==='custom'&&w.wordsDailyGoals.length===days){wdg=w.wordsDailyGoals.map(Number);}
            else{const eq=Math.floor(remainingW/days),rem=remainingW-eq*(days-1);wdg=Array.from({length:days},(_,i)=>i===days-1?rem:eq);}
            task.wordsTotal=totalW;task.wordsOffset=offsetW;task.wordsDailyGoals=wdg;task.startDate=task.startDate||today;
          } else {task.wordsTotal=0;task.wordsDailyGoals=[];}
        }
      }
    } else {
      const task={id:this.uid(),name:w.name.trim(),type:w.type,active:true,schedule:w.schedule,scheduledTime:w.schedule==='fixed'?w.scheduledTime:null,daysOfWeek:w.daysOfWeek};
      if(w.type==='goal'){
        Object.assign(task,{goalUnit:w.goalUnit,dailyGoals,startDate:today,totalBook:parseInt(w.totalGoal),startOffset:offset});
        // Salva chapterPages e monta unitConversions para conversão por página
        if(w.chapterPages&&w.chapterPages.length>0&&parseInt(w.numChapters)>0){
          const cp=w.chapterPages.map(v=>parseInt(v)||0);
          task.chapterPages=cp; // página inicial de cada unidade (cap, versículo etc)
          // Monta mapa página→unidade para uso no registro
          // unitConversions['páginas'] = pages-per-unit média (fallback)
          const filled=cp.filter(v=>v>0);
          if(filled.length>1){
            const avgPages=Math.round(((Math.max(...filled)-Math.min(...filled))/(filled.length-1))*10)/10;
            task.unitConversions=task.unitConversions||{};
            task.unitConversions['páginas']=avgPages>0?avgPages:1;
          }
        }
        // Pre-register the offset as already-done progress so absolute position math is correct
        if(offset>0){
          this.state.tasks.push(task);
          // We'll set it after push so task.id is available
          this.setTaskDayData(task.id,today,{progress:0,completed:false,_offsetRegistered:true});
        }
      } else if(w.type==='simple'){
        task.dailyMinutes=parseInt(w.dailyMinutes)||0;
        if(w.wordsEnabled&&parseInt(w.wordsTotal)>0&&parseInt(w.wordsDays)>0){
          const totalW=parseInt(w.wordsTotal),offsetW=parseInt(w.wordsOffset)||0;
          const remainingW=totalW-offsetW,days=parseInt(w.wordsDays);
          let wdg;
          if(w.wordsDistribution==='custom'&&w.wordsDailyGoals.length===days){wdg=w.wordsDailyGoals.map(Number);}
          else{const eq=Math.floor(remainingW/days),rem=remainingW-eq*(days-1);wdg=Array.from({length:days},(_,i)=>i===days-1?rem:eq);}
          task.wordsTotal=totalW;task.wordsOffset=offsetW;task.wordsDailyGoals=wdg;task.startDate=today;
        }
      }
      if(!this.state.tasks.includes(task))this.state.tasks.push(task);
    }
    this.save();this.closeModal();this.state.view='today';this.render();
  },

      <div class="modal-sub">${task.name}</div>

      <div style="background:var(--surface2);border-radius:12px;padding:12px 14px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span style="color:var(--muted)">Meta hoje</span><b>${goal} ${task.goalUnit}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--muted)">Posição atual</span><b style="color:var(--accent)">${totalReadSoFar} / ${totalBook} ${task.goalUnit}</b></div>
      </div>

      ${altUnits.length>0?`
      <div class="form-group">
        <label class="form-label">📐 Registrar em qual unidade?</label>
        <div class="toggle-group" style="flex-wrap:wrap">
          <button class="toggle-btn ${!isAltUnit?'active':''}" onclick="App.setLogUnit('${task.goalUnit}')" style="font-size:12px">${task.goalUnit}</button>
          ${altUnits.map(u=>`<button class="toggle-btn ${selectedUnit===u?'active':''}" onclick="App.setLogUnit('${u}')" style="font-size:12px">${u}</button>`).join('')}
        </div>
      </div>`:''}

      <div class="form-group">
        ${isAltUnit
          ? `<label class="form-label">Quantos(as) <b style="color:var(--accent)">${selectedUnit}</b> você fez?</label>`
          : `<label class="form-label">📍 Em qual ${task.goalUnit} você parou?</label>`}
        <div class="log-controls">
          <button class="log-ctrl-btn" onclick="App.adjustLogPosition(-1)">−</button>
          <input class="log-ctrl-input" id="log-position" type="number" min="0"
            value="${inputVal}"
            placeholder="${isAltUnit?'ex: 1':'ex: '+totalReadSoFar}"
            oninput="App.handleLogInput(event)">
          <button class="log-ctrl-btn" onclick="App.adjustLogPosition(1)">+</button>
        </div>
        ${isAltUnit&&previewPages!==null&&!noConv?`
          <div style="margin-top:8px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--accent)">
            ≈ <b>${previewPages} ${task.goalUnit}</b> (${inputVal} ${selectedUnit} × ${convRate} ${task.goalUnit}/${selectedUnit})
          </div>`:''}
        ${noConv?`
          <div style="margin-top:8px;background:rgba(139,124,246,.1);border:1px solid rgba(139,124,246,.2);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--accent2)">
            ⚠️ Taxa de conversão não definida. Será registrado apenas como +${inputVal||'?'} ${selectedUnit} (sem converter para ${task.goalUnit}).
            <button onclick="App.openDefineConversion('${task.id}','${selectedUnit}')" style="display:block;margin-top:6px;background:var(--surface3);border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--text);cursor:pointer">Definir conversão agora</button>
          </div>`:''}
      </div>

      <button class="btn-primary" onclick="App.confirmLogProgress()">✓ Confirmar</button>
      <button class="btn-secondary" onclick="App.closeModal()">Cancelar</button>
    </div>
  </div>`;
},

  // --- Helpers para multi-unidade ---

  // Retorna lista de unidades alternativas conhecidas (exceto a principal)
  getAltUnits(task){
    const base=['páginas','cap.','versículos','seções','km','min'];
    const extra=Object.keys(task.unitConversions||{});
    const all=[...new Set([...base,...extra])].filter(u=>u!==task.goalUnit);
    return all;
  },

  // Dado um número de página, retorna em qual unidade (cap., versículo etc) ela está
  pageToUnit(task,page){
    const cp=task.chapterPages;
    if(!cp||cp.length===0)return null;
    // Encontra o último capítulo cuja página inicial <= page
    let unit=1;
    for(let i=0;i<cp.length;i++){
      if(cp[i]>0&&cp[i]<=page)unit=i+1;
    }
    return unit;
  },
  // Retorna taxa de conversão: quantas unidades-base por 1 unidade alternativa
  // Ex: 1 capítulo = 8 páginas → getConversionRate(task,'cap.') = 8
  getConversionRate(task,unit){
    const map=task.unitConversions||{};
    return map[unit]||0; // 0 = não definido
  },

  // Atualiza a unidade selecionada no modal sem fechar
  setLogUnit(unit){
    if(!this.state.modal)return;
    this.state.modal.selectedUnit=unit;
    this.state.modal.logAmount='';
    this.render();
  },

  // Ajusta o valor do input +/- 1 (respeitando a unidade selecionada)
  adjustLogPosition(delta){
    const m=this.state.modal,task=this.state.tasks.find(t=>t.id===m.taskId); if(!task)return;
    const el=document.getElementById('log-position');
    const selectedUnit=m.selectedUnit||task.goalUnit;
    const isAltUnit=selectedUnit!==task.goalUnit;
    if(isAltUnit){
      // No modo alternativo: incrementa a quantidade de unidades alt
      const cur=parseFloat(el?el.value:m.logAmount)||0;
      const nv=Math.max(0,cur+delta);
      if(el)el.value=nv;
      m.logAmount=nv;
    } else {
      // No modo posição absoluta: ajusta a posição
      const cur=parseInt(el?el.value:m.logAmount)||m.currentPosition||0;
      const nv=Math.max(0,cur+delta);
      if(el)el.value=nv;
      m.logAmount=nv;
    }
    // Força atualizar preview sem re-render completo
    this.state.modal.logAmount=parseFloat(el?el.value:m.logAmount)||0;
    this.render();
  },

  // Atualiza logAmount conforme usuário digita
  handleLogInput(event){
    if(this.state.modal) this.state.modal.logAmount=event.target.value;
  },

  // Confirma e salva o progresso (com conversão se necessário)
  confirmLogProgress(){
    const m=this.state.modal,task=this.state.tasks.find(t=>t.id===m.taskId); if(!task)return;
    const today=this.getToday();
    const goal=this.getTaskGoalForDay(task,today);
    const selectedUnit=m.selectedUnit||task.goalUnit;
    const isAltUnit=selectedUnit!==task.goalUnit;
    const inputVal=parseFloat(m.logAmount);
    if(isNaN(inputVal)||inputVal<0){this.showToast('Digite um valor válido','error');return;}

    let newProgressPages; // progresso em unidade principal (páginas etc)

    if(isAltUnit){
      // Caso especial: registrar por página com chapterPages definido
      if(selectedUnit==='páginas'&&task.chapterPages&&task.chapterPages.length>0){
        // Conta quantos capítulos completos o usuário passou com base na página
        const cp=task.chapterPages;
        const page=inputVal;
        let chapsDone=0;
        for(let i=0;i<cp.length;i++){
          const nextStart=(i+1<cp.length&&cp[i+1]>0)?cp[i+1]:Infinity;
          if(cp[i]>0&&page>=nextStart)chapsDone=i+1;
        }
        newProgressPages=chapsDone;
        this.showToast('Página '+page+' → '+chapsDone+' '+task.goalUnit+' concluído(s)','success');
      } else {
      const convRate=this.getConversionRate(task,selectedUnit);
      if(convRate>0){
        // Converte: valor_alt × taxa = páginas equivalentes
        const pagesEquiv=Math.round(inputVal*convRate);
        // Soma ao progresso já existente do dia
        const existingProgress=this.getTaskDayData(task.id,today).progress||0;
        newProgressPages=existingProgress+pagesEquiv;
        this.showToast(`+${pagesEquiv} ${task.goalUnit} (${inputVal} ${selectedUnit})`, 'success');
      } else {
        // Sem taxa: registra como "+N unidades alt" sem converter — armazena em altProgress
        const data=this.getTaskDayData(task.id,today);
        const altProgress=(data.altProgress||{});
        altProgress[selectedUnit]=(altProgress[selectedUnit]||0)+inputVal;
        this.setTaskDayData(task.id,today,{altProgress});
        this.save(); this.closeModal(); this.render();
        this.showToast(`+${inputVal} ${selectedUnit} registrado(s)`, 'success');
        return;
      }
      } // fecha else do caso especial páginas+chapterPages
    } else {
      // Modo posição absoluta: newProgressPages = inputVal - cumDoneBefore
      const cumDoneBefore=m.cumDoneBefore||0;
      newProgressPages=Math.max(0,inputVal-cumDoneBefore);
      // Se chapterPages definido, mostra em qual capítulo o usuário parou
      if(task.chapterPages&&task.chapterPages.length>0){
        const cp2=task.chapterPages;
        const absPage=inputVal;
        let curChap=1;
        for(let i=0;i<cp2.length;i++){if(cp2[i]>0&&cp2[i]<=absPage)curChap=i+1;}
        const nextChapStart=(curChap<cp2.length&&cp2[curChap]>0)?cp2[curChap]:null;
        const chapInfo=nextChapStart?' · próx. cap. na pág. '+nextChapStart:' (último cap.)';
        this.showToast('Pág. '+absPage+' → Cap. '+curChap+chapInfo,'info');
      }

    }

    // Salva o progresso e dispara fluxo normal
    this.setTaskDayData(task.id,today,{progress:newProgressPages});
    this.save();
    const isFull=newProgressPages>=goal;
    if(isFull&&!this.getTaskDayData(task.id,today).finishedTime){
      this.closeModal();
      this.promptFinishTime(task.id,today);
    } else {
      this.closeModal();
      this.render();
    }
    if(!isFull)this.showToast(`✓ ${newProgressPages}/${goal} ${task.goalUnit}`, 'success');
  },

  // Abre modal para definir taxa de conversão de uma unidade alternativa
  openDefineConversion(taskId,unit){
    this.state.modal={type:'defineConversion',taskId,unit};
    this.render();
  },
  renderDefineConversionModal(){
    const m=this.state.modal,task=this.state.tasks.find(t=>t.id===m.taskId); if(!task)return'';
    const existing=(task.unitConversions||{})[m.unit]||'';
    return `<div class="overlay center" onclick="if(event.target===this)App.closeModal()">
      <div class="modal card-modal">
        <div class="modal-title">📐 Definir conversão</div>
        <div class="modal-sub">Quanto vale 1 <b>${m.unit}</b> em <b>${task.goalUnit}</b>?</div>
        <div style="background:var(--surface2);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--muted)">
          Ex: se 1 capítulo ≈ 8 páginas, digite <b style="color:var(--accent)">8</b>.
        </div>
        <div class="form-group">
          <label class="form-label">1 ${m.unit} = quantos(as) ${task.goalUnit}?</label>
          <input class="form-input" id="conv-rate-input" type="number" min="0.1" step="0.1" placeholder="ex: 8" value="${existing}" style="font-size:20px;font-weight:700;text-align:center">
        </div>
        <button class="btn-primary" onclick="App.saveConversionRate('${taskId}','${m.unit}')">💾 Salvar</button>
        <button class="btn-secondary" onclick="App.openLogProgress('${taskId}')">← Voltar</button>
      </div>
    </div>`;
  },
  saveConversionRate(taskId,unit){
    const el=document.getElementById('conv-rate-input');
    const rate=parseFloat(el?el.value:0);
    if(isNaN(rate)||rate<=0){this.showToast('Digite uma taxa válida','error');return;}
    const task=this.state.tasks.find(t=>t.id===taskId); if(!task)return;
    if(!task.unitConversions)task.unitConversions={};
    task.unitConversions[unit]=rate;
    this.save();
    this.showToast(`✓ 1 ${unit} = ${rate} ${task.goalUnit}`,'success');
    this.openLogProgress(taskId);
  },

  // ===================== TASK DETAIL =====================
  openTaskDetail(taskId){this.state.modal={type:'taskDetail',taskId};this.render();},

  fmtDate(dateStr){const[y,m,d]=dateStr.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pt-BR',{day:'numeric',month:'short'});},
  fmtDateLong(dateStr){const[y,m,d]=dateStr.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});},
  getDow(dateStr){const[y,m,d]=dateStr.split('-').map(Number);return new Date(y,m-1,d).getDay();},

  renderTaskDetailModal(){
    const m=this.state.modal,task=this.state.tasks.find(t=>t.id===m.taskId);
    if(!task)return'';
    const today=this.getToday();
    return task.type==='goal'?this.renderGoalDetail(task,today):this.renderSimpleDetail(task,today);
  },

  renderGoalDetail(task,today){
    const totalDays=task.dailyGoals.length;
    const endDate=this.addDays(task.startDate,totalDays-1);
    const todayIdx=this.daysDiff(task.startDate,today);
    const startOffset=task.startOffset||0;
    const totalBook=task.totalBook||task.dailyGoals.reduce((a,b)=>a+b,0)+startOffset;
    let taskGoalSum=0,totalDone=0,missedDays=[],delayedDays=0;
    const dowLabels=['D','S','T','Q','Q','S','S'];
    const statusClass={done:'tl-done',partial:'tl-partial',missed:'tl-missed',today:'tl-today tl-partial',future:'tl-future',skipped:'tl-skipped'};

    const dayStatuses=task.dailyGoals.map((goal,i)=>{
      const date=this.addDays(task.startDate,i);
      const data=this.getTaskDayData(task.id,date);
      const progress=data.progress||0;
      taskGoalSum+=goal; totalDone+=Math.min(goal,progress);
      const isPast=date<today,isToday=date===today,isFuture=date>today;
      let status='future';
      if(isFuture)status='future';
      else if(data.skipped)status='skipped';
      else if(progress>=goal)status='done';
      else if(progress>0)status='partial';
      else if(isPast){status='missed';missedDays.push({date,goal,progress});delayedDays++;}
      else if(isToday)status=progress>0?'partial':'today';
      return{date,goal,progress,status,i};
    });

    // Global progress: (startOffset + totalDone) / totalBook
    const totalReadSoFar=startOffset+totalDone;
    const globalPct=totalBook>0?Math.min(100,Math.round((totalReadSoFar/totalBook)*100)):0;
    // Task-only progress (days remaining)
    const taskPct=taskGoalSum>0?Math.min(100,Math.round((totalDone/taskGoalSum)*100)):0;

    const daysLeft=Math.max(0,this.daysDiff(today,endDate));
    const isLate=today>endDate&&todayIdx<totalDays;
    const isFinished=todayIdx>=totalDays&&taskPct===100;
    const startDow=this.getDow(task.startDate);
    const gridCells=[];
    for(let i=0;i<startDow;i++)gridCells.push({empty:true});
    dayStatuses.forEach(ds=>gridCells.push(ds));

    return `<div class="overlay" onclick="if(event.target===this)App.closeModal()">
      <div class="modal" style="padding-bottom:48px">
        <div class="modal-handle"></div>
        <div class="detail-header">
          <div class="detail-icon">🎯</div>
          <div><div class="detail-title">${task.name}</div><span class="detail-type-badge goal">Meta</span></div>
        </div>

        <div class="detail-meta-row">
          <div class="detail-meta-box">
            <div class="detail-meta-label">📅 Início</div>
            <div class="detail-meta-val">${this.fmtDate(task.startDate)}</div>
          </div>
          <div class="detail-meta-box">
            <div class="detail-meta-label">${isLate?'⚠️ Encerrou':'🏁 Término'}</div>
            <div class="detail-meta-val ${isLate?'red':'accent'}">${this.fmtDate(endDate)}</div>
          </div>
          <div class="detail-meta-box">
            <div class="detail-meta-label">${isFinished?'✅ Status':daysLeft===0?'⏰ Prazo':'⏳ Restam'}</div>
            <div class="detail-meta-val ${isFinished?'green':isLate?'red':'accent'}">${isFinished?'Concluído':isLate?'Atrasado':daysLeft+' dia'+(daysLeft!==1?'s':'')}</div>
          </div>
        </div>

        <div class="detail-meta-row">
          <div class="detail-meta-box">
            <div class="detail-meta-label">📖 Total do livro</div>
            <div class="detail-meta-val">${totalBook} ${task.goalUnit}</div>
          </div>
          <div class="detail-meta-box">
            <div class="detail-meta-label">✅ Lido no total</div>
            <div class="detail-meta-val green">${totalReadSoFar} ${task.goalUnit}</div>
          </div>
          <div class="detail-meta-box">
            <div class="detail-meta-label">⚠️ Atrasos</div>
            <div class="detail-meta-val ${delayedDays>0?'red':'green'}">${delayedDays} dia${delayedDays!==1?'s':''}</div>
          </div>
        </div>

        ${startOffset>0?`<div style="background:rgba(139,124,246,.1);border:1px solid rgba(139,124,246,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--accent2);margin-bottom:14px">
          📍 Iniciado na ${task.goalUnit} <b>${startOffset+1}</b> — ${startOffset} ${task.goalUnit} já lidas antes de cadastrar
        </div>`:''}

        <div style="margin-bottom:18px">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px">
            <span>Progresso geral (${totalReadSoFar}/${totalBook})</span><b style="color:var(--accent)">${globalPct}%</b>
          </div>
          <div class="detail-progress-bar">
            <div class="detail-progress-fill is-overall" style="width:${globalPct}%"></div>
          </div>
          ${startOffset>0?`<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px">
            <span>Progresso desta fase (${totalDone}/${taskGoalSum})</span><b style="color:var(--accent2)">${taskPct}%</b>
          </div>
          <div class="detail-progress-bar" style="margin-top:4px">
            <div class="detail-progress-fill" style="width:${taskPct}%;background:var(--accent2)"></div>
          </div>`:''}
        </div>

        <div class="detail-section">
          <div class="detail-section-title">📆 Calendário da meta</div>
          <div class="timeline-grid">
            ${dowLabels.map(l=>`<div class="tl-col-head">${l}</div>`).join('')}
            ${gridCells.map(cell=>{
              if(cell.empty)return`<div class="tl-cell tl-empty"></div>`;
              const cls=statusClass[cell.status]||'tl-future';
              const day=parseInt(cell.date.split('-')[2]);
              const tip=`${this.fmtDate(cell.date)}: ${cell.progress}/${cell.goal} ${task.goalUnit}`;
              return`<div class="tl-cell ${cls}" title="${tip}">${day}</div>`;
            }).join('')}
          </div>
          <div class="legend-row" style="margin-top:10px">
            <div class="legend-item"><div class="legend-dot" style="background:rgba(46,213,115,.4)"></div>Feito</div>
            <div class="legend-item"><div class="legend-dot" style="background:color-mix(in srgb,var(--accent) 30%,transparent)"></div>Parcial</div>
            <div class="legend-item"><div class="legend-dot" style="background:rgba(255,107,107,.3)"></div>Perdido</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--surface3)"></div>Futuro</div>
          </div>
        </div>

        ${missedDays.length>0?`
        <div class="detail-section">
          <div class="detail-section-title">⚠️ Dias não realizados (${missedDays.length})</div>
          <div class="missed-day-list">
            ${missedDays.map(({date,goal,progress})=>{
              const pct=goal>0?Math.round((progress/goal)*100):0;
              return`<div class="missed-day-item">
                <div class="missed-day-dot"></div>
                <div class="missed-day-info">
                  <div class="missed-day-date">${this.fmtDateLong(date)}</div>
                  <div class="missed-day-detail">${progress>0?progress+' de '+goal+' '+task.goalUnit+' feito':'Sem progresso registrado'}</div>
                </div>
                <div class="missed-day-pct">${pct}%</div>
              </div>`;
            }).join('')}
          </div>
        </div>`:(todayIdx>0?`<div style="background:rgba(46,213,115,.08);border:1px solid rgba(46,213,115,.2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--green);text-align:center">🎉 Nenhum dia perdido até agora! Continue assim.</div>`:'')}

        <button class="btn-secondary" style="margin-top:16px" onclick="App.closeModal()">Fechar</button>
        <button class="btn-primary" onclick="App.closeModal();App.openEditTask('${task.id}')">✏️ Editar tarefa</button>
      </div>
    </div>`;
  },

  renderSimpleDetail(task,today){
    const past=[];
    for(let i=27;i>=0;i--){const date=this.addDays(today,-i);if(this.isTaskActiveOnDate(task,date))past.push(date);}
    const missedDays=past.filter(date=>date<today&&!this.getTaskDayData(task.id,date).completed&&!this.getTaskDayData(task.id,date).skipped);
    const doneDays=past.filter(date=>this.getTaskDayData(task.id,date).completed);
    const totalPast=past.filter(d=>d<today).length;
    const pct=totalPast>0?Math.round((doneDays.length/totalPast)*100):0;
    const dowLabels=['D','S','T','Q','Q','S','S'];
    const startDow=past.length>0?this.getDow(past[0]):0;
    const gridCells=[];
    for(let i=0;i<startDow;i++)gridCells.push({empty:true});
    const statusClass={done:'tl-done',missed:'tl-missed',today:'tl-today',future:'tl-future',skipped:'tl-skipped'};
    past.forEach(date=>{
      const d=this.getTaskDayData(task.id,date);
      const isToday=date===today;
      let status='future';
      if(isToday)status=d.completed?'done':'today';
      else if(d.skipped)status='skipped';
      else if(d.completed)status='done';
      else status='missed';
      gridCells.push({date,status});
    });
    const dowNames=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    const activeDows=(task.daysOfWeek||[0,1,2,3,4,5,6]).map(i=>dowNames[i]).join(', ');
    const firstDone=Object.keys(this.state.history).filter(date=>(this.state.history[date]||{})[task.id]?.completed).sort()[0];

    return`<div class="overlay" onclick="if(event.target===this)App.closeModal()">
      <div class="modal" style="padding-bottom:48px">
        <div class="modal-handle"></div>
        <div class="detail-header">
          <div class="detail-icon">✅</div>
          <div><div class="detail-title">${task.name}</div><span class="detail-type-badge simple">Tarefa simples</span></div>
        </div>

        <div class="detail-meta-row">
          <div class="detail-meta-box">
            <div class="detail-meta-label">📅 Primeira vez</div>
            <div class="detail-meta-val">${firstDone?this.fmtDate(firstDone):'—'}</div>
          </div>
          <div class="detail-meta-box">
            <div class="detail-meta-label">✅ Taxa 28d</div>
            <div class="detail-meta-val ${pct>=80?'green':pct>=50?'accent':'red'}">${pct}%</div>
          </div>
          <div class="detail-meta-box">
            <div class="detail-meta-label">⚠️ Faltas 28d</div>
            <div class="detail-meta-val ${missedDays.length===0?'green':'red'}">${missedDays.length} dia${missedDays.length!==1?'s':''}</div>
          </div>
        </div>

        <div class="detail-meta-row">
          <div class="detail-meta-box" style="flex:2">
            <div class="detail-meta-label">🗓️ Dias ativos</div>
            <div class="detail-meta-val" style="font-size:12px">${activeDows}</div>
          </div>
          <div class="detail-meta-box">
            <div class="detail-meta-label">⏰ Horário</div>
            <div class="detail-meta-val" style="font-size:12px">${task.schedule==='fixed'?task.scheduledTime:'Flexível'}</div>
          </div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">📆 Últimos 28 dias</div>
          <div class="timeline-grid">
            ${dowLabels.map(l=>`<div class="tl-col-head">${l}</div>`).join('')}
            ${gridCells.map(cell=>{
              if(cell.empty)return`<div class="tl-cell tl-empty"></div>`;
              const cls=statusClass[cell.status]||'tl-future';
              const day=parseInt(cell.date.split('-')[2]);
              return`<div class="tl-cell ${cls}" title="${this.fmtDate(cell.date)}: ${cell.status}">${day}</div>`;
            }).join('')}
          </div>
          <div class="legend-row" style="margin-top:10px">
            <div class="legend-item"><div class="legend-dot" style="background:rgba(46,213,115,.4)"></div>Feito</div>
            <div class="legend-item"><div class="legend-dot" style="background:rgba(255,107,107,.3)"></div>Não feito</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--surface3);border:1px dashed rgba(255,255,255,.15)"></div>Pulado</div>
          </div>
        </div>

        ${missedDays.length>0?`
        <div class="detail-section">
          <div class="detail-section-title">⚠️ Dias não realizados (${missedDays.length})</div>
          <div class="missed-day-list">
            ${missedDays.slice(-8).reverse().map(date=>`<div class="missed-day-item">
              <div class="missed-day-dot"></div>
              <div class="missed-day-info">
                <div class="missed-day-date">${this.fmtDateLong(date)}</div>
                <div class="missed-day-detail">${task.schedule==='fixed'&&task.scheduledTime?'Marcada para '+task.scheduledTime:'Tarefa flexível não realizada'}</div>
              </div>
              <div class="missed-day-pct">✗</div>
            </div>`).join('')}
            ${missedDays.length>8?`<div style="text-align:center;font-size:12px;color:var(--muted);padding:6px">+ ${missedDays.length-8} dias anteriores</div>`:''}
          </div>
        </div>`:(totalPast>0?`<div style="background:rgba(46,213,115,.08);border:1px solid rgba(46,213,115,.2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--green);text-align:center">🎉 Nenhum dia perdido nos últimos 28 dias!</div>`:'')}

        <button class="btn-secondary" style="margin-top:16px" onclick="App.closeModal()">Fechar</button>
        <button class="btn-primary" onclick="App.closeModal();App.openEditTask('${task.id}')">✏️ Editar tarefa</button>
      </div>
    </div>`;
  },

  // ===================== SUGGESTION / MISSED =====================
  openSuggestion(taskId){this.state.modal={type:'suggestion',taskId};this.render();},
  renderSuggestionModal(){
    const m=this.state.modal,task=this.state.tasks.find(t=>t.id===m.taskId); if(!task)return'';
    const info=this.getMissedInsights().find(i=>i.task.id===m.taskId);
    return `<div class="overlay center" onclick="if(event.target===this)App.closeModal()">
      <div class="modal card-modal">
        <div class="modal-title">💡 O que deseja fazer?</div>
        <div class="modal-sub"><b>${task.name}</b> não concluída em ${info?info.missed+' dias':'alguns dias'} esta semana.</div>
        <div class="option-list">
          ${task.type==='goal'?`
            <button class="option-btn" onclick="App.suggestionReduceGoal('${task.id}')"><span class="opt-icon">⬇️</span><div><b>Diminuir meta</b><br><small style="color:var(--muted)">Reduzir quantidade diária</small></div></button>
            <button class="option-btn" onclick="App.suggestionExtendDays('${task.id}')"><span class="opt-icon">📅</span><div><b>Adicionar mais dias</b></div></button>`:''}
          ${task.schedule==='fixed'?`
            <button class="option-btn" onclick="App.suggestionChangeSchedule('${task.id}','flexible')"><span class="opt-icon">🔄</span><div><b>Tornar flexível</b></div></button>
            <button class="option-btn" onclick="App.suggestionChangeTime('${task.id}')"><span class="opt-icon">⏰</span><div><b>Mudar horário</b></div></button>`:`
            <button class="option-btn" onclick="App.openEditTask('${task.id}')"><span class="opt-icon">✏️</span><div><b>Editar tarefa</b></div></button>`}
          <button class="option-btn" style="border-color:rgba(255,107,107,.3)" onclick="App.deleteTask('${task.id}');App.closeModal()"><span class="opt-icon">🗑️</span><div><b style="color:var(--red)">Remover tarefa</b></div></button>
          <button class="option-btn" onclick="App.closeModal()"><span class="opt-icon">✓</span><div><b>Manter como está</b></div></button>
        </div>
      </div>
    </div>`;
  },
  suggestionReduceGoal(taskId){const task=this.state.tasks.find(t=>t.id===taskId);if(!task||task.type!=='goal')return;const pct=parseFloat(prompt('Reduzir para qual % da meta atual?\n(ex: 80 = 80%):','80'))/100;if(isNaN(pct)||pct<=0||pct>1)return;task.dailyGoals=task.dailyGoals.map(g=>Math.round(g*pct));this.save();this.closeModal();this.render();},
  suggestionExtendDays(taskId){const task=this.state.tasks.find(t=>t.id===taskId);if(!task||task.type!=='goal')return;const extra=parseInt(prompt('Quantos dias a mais?','3')||'0');if(isNaN(extra)||extra<=0)return;const today=this.getToday(),todayIdx=this.daysDiff(task.startDate,today);let done=0;task.dailyGoals.forEach((g,i)=>{const d=this.addDays(task.startDate,i);done+=Math.min(g,this.getTaskDayData(taskId,d).progress||0);});const remaining=task.dailyGoals.reduce((a,b)=>a+b,0)-done;const newDays=Math.max(1,task.dailyGoals.length-todayIdx-1+extra);const perDay=Math.ceil(remaining/newDays);const newGoals=[...task.dailyGoals.slice(0,todayIdx+1)];for(let i=0;i<newDays;i++)newGoals.push(perDay);task.dailyGoals=newGoals;this.save();this.closeModal();this.render();},
  suggestionChangeSchedule(taskId,s){const task=this.state.tasks.find(t=>t.id===taskId);if(task){task.schedule=s;task.scheduledTime=null;this.save();}this.closeModal();this.render();},
  suggestionChangeTime(taskId){const task=this.state.tasks.find(t=>t.id===taskId);if(!task)return;const t=prompt('Novo horário (ex: 20:00):',task.scheduledTime||'08:00');if(t){task.scheduledTime=t;this.save();}this.closeModal();this.render();},

  checkMissedTasks(){
    const today=this.getToday(),nowMins=this.timeToMins(this.getNow());
    this.state.tasks.forEach(task=>{
      if(!this.isTaskActiveOnDate(task,today)||task.schedule!=='fixed'||!task.scheduledTime) return;
      const done = this.isTaskDayDone(task, today);
      if(!done && nowMins>this.timeToMins(task.scheduledTime)+30){
        const key=`missed_${task.id}_${today}`;
        if(!localStorage.getItem(key)){
          localStorage.setItem(key,'1');
          if(!this.state.modal) this.state.modal={type:'missedTask',taskId:task.id};
        }
      }
    });
  },
  renderMissedTaskModal(){
    const m=this.state.modal,task=this.state.tasks.find(t=>t.id===m.taskId); if(!task)return'';
    return `<div class="overlay center">
      <div class="modal card-modal">
        <div style="font-size:36px;text-align:center;margin-bottom:12px">⏰</div>
        <div class="modal-title" style="text-align:center">Tarefa atrasada</div>
        <div class="missed-task-info"><div class="missed-task-name">${task.name}</div><div class="missed-task-time">⚠️ Estava marcada para ${task.scheduledTime}</div></div>
        <div class="option-list">
          <button class="option-btn" onclick="App.closeModal();App.render()"><span class="opt-icon">▶️</span><div><b>Fazer agora</b></div></button>
          <button class="option-btn" onclick="App.missedReschedule('${task.id}')"><span class="opt-icon">⏰</span><div><b>Marcar outro horário</b></div></button>
          <button class="option-btn" onclick="App.missedMakeFlexible('${task.id}')"><span class="opt-icon">🔄</span><div><b>Tornar flexível hoje</b></div></button>
          <button class="option-btn" onclick="App.missedSkip('${task.id}')"><span class="opt-icon">⏭️</span><div><b>Pular hoje</b></div></button>
        </div>
      </div>
    </div>`;
  },
  missedReschedule(taskId){const task=this.state.tasks.find(t=>t.id===taskId);if(!task)return;const t=prompt('Novo horário (ex: 20:00):',this.getNow());if(t){task.scheduledTime=t;this.save();}this.closeModal();this.render();},
  missedMakeFlexible(taskId){const task=this.state.tasks.find(t=>t.id===taskId);if(task){task.schedule='flexible';task.scheduledTime=null;this.save();}this.closeModal();this.render();},
  missedSkip(taskId){this.setTaskDayData(taskId,this.getToday(),{skipped:true});this.save();this.closeModal();this.render();},
  openInsights(){this.state.modal={type:'insights'};this.render();},
  renderInsightsModal(){
    const insights=this.getMissedInsights();
    return `<div class="overlay" onclick="if(event.target===this)App.closeModal()">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-title">💡 Sugestões da semana</div>
        <div class="option-list">
          ${insights.map(({task,missed,total})=>`
            <button class="option-btn" onclick="App.state.modal={type:'suggestion',taskId:'${task.id}'};App.render()">
              <span class="opt-icon">⚠️</span>
              <div><b>${task.name}</b><br><small style="color:var(--muted)">Perdida ${missed} de ${total} dias</small></div>
            </button>`).join('')}
        </div>
        <button class="btn-secondary" onclick="App.closeModal()">Fechar</button>
      </div>
    </div>`;
  },

  // ===================== MEDALS VIEW =====================
  openMedalDetail(taskId){
    this.state.modal={type:'medalDetail',taskId};
    this.render();
  },
  renderMedalDetailModal(){
    const m=this.state.modal;
    const task=this.state.tasks.find(t=>t.id===m.taskId); if(!task)return'';
    if(!this.state.medalMonth)return'';
    const {y,mo}=this.state.medalMonth; const month=mo||this.state.medalMonth.m;
    const year=y;
    const pad=n=>String(n).padStart(2,'0');
    const daysInMonth=new Date(year,month,0).getDate();
    const monthNames=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const dayNames=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const medalDefs={platinum:{icon:'💎',label:'Platinum'},ouro:{icon:'🥇',label:'Ouro'},prata:{icon:'🥈',label:'Prata'},bronze:{icon:'🥉',label:'Bronze'}};
    const days=[];
    for(let d=1;d<=daysInMonth;d++){
      const date=`${year}-${pad(month)}-${pad(d)}`;
      const dayGoal=this.getTaskGoalForDay(task,date);
      if(!dayGoal)continue;
      const prog=this.getTaskDayData(task.id,date).progress||0;
      const med=this.getMedal(prog,dayGoal);
      if(med)days.push({date,d,dayGoal,prog,med});
    }
    const rowsHtml=days.length===0
      ?`<div style="color:var(--muted);text-align:center;padding:20px 0;font-size:14px">Nenhuma medalha neste mês.</div>`
      :days.map(({date,d,dayGoal,prog,med})=>{
        const [yr,mo2,da]=date.split('-').map(Number);
        const dow=dayNames[new Date(yr,mo2-1,da).getDay()];
        const pct=Math.round(prog/dayGoal*100);
        return`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:10px;margin-bottom:7px">
          <div style="text-align:center;min-width:36px">
            <div style="font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted)">${dow}</div>
            <div style="font-size:18px;font-weight:800;line-height:1.1">${d}</div>
          </div>
          <span class="medal-badge ${med.cls}">${med.icon} ${med.label}</span>
          <div style="flex:1;font-size:12px;color:var(--muted)">${prog}/${dayGoal} ${task.goalUnit} <b style="color:var(--accent)">(${pct}%)</b></div>
        </div>`;
      }).join('');
    return`<div class="overlay center" onclick="if(event.target===this)App.closeModal()">
      <div class="modal card-modal">
        <div class="modal-handle"></div>
        <div class="modal-title" style="font-size:16px">${task.name}</div>
        <div class="modal-sub">Medalhas de ${monthNames[month-1]} ${year}</div>
        <div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap">
          ${['platinum','ouro','prata','bronze'].map(c=>{const cnt=days.filter(x=>x.med.cls===c).length;return cnt>0?`<span class="rank-medal-count ${c}">${medalDefs[c].icon} ${cnt}</span>`:''}).join('')}
        </div>
        <div style="max-height:55vh;overflow-y:auto;padding-right:2px">${rowsHtml}</div>
        <button class="btn-secondary" onclick="App.closeModal()" style="margin-top:12px">Fechar</button>
      </div>
    </div>`;
  },
  renderMedalsView(){
    const now=new Date();
    if(!this.state.medalMonth)this.state.medalMonth={y:now.getFullYear(),m:now.getMonth()+1};
    const {y,m}=this.state.medalMonth;
    const monthNames=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const ranking=this.getMedalRanking(y,m);
    const totalByType={bronze:0,prata:0,ouro:0,platinum:0};
    ranking.forEach(r=>{totalByType.bronze+=r.counts.bronze;totalByType.prata+=r.counts.prata;totalByType.ouro+=r.counts.ouro;totalByType.platinum+=r.counts.platinum;});
    const prevM=m===1?{y:y-1,m:12}:{y,m:m-1};
    const nextM=m===12?{y:y+1,m:1}:{y,m:m+1};
    const isCurrentMonth=y===now.getFullYear()&&m===now.getMonth()+1;

    const medalDefs=[
      {cls:'platinum',icon:'💎',label:'Platinum',desc:'Acima da meta',sub:'progress > meta do dia'},
      {cls:'ouro',    icon:'🥇',label:'Ouro',    desc:'Meta atingida', sub:'progress = meta do dia'},
      {cls:'prata',   icon:'🥈',label:'Prata',   desc:'Metade da meta',sub:'≥ 50% da meta do dia'},
      {cls:'bronze',  icon:'🥉',label:'Bronze',  desc:'Abaixo da metade',sub:'< 50% da meta do dia'},
    ];

    const legendHtml=medalDefs.map(d=>`
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:10px">
        <span style="font-size:20px">${d.icon}</span>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700"><span class="medal-badge ${d.cls}" style="margin-right:6px">${d.label}</span>${d.desc}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${d.sub}</div>
        </div>
        <div style="font-size:18px;font-weight:800;color:var(--muted)">${totalByType[d.cls]||0}</div>
      </div>`).join('');

    const rankingHtml=ranking.length===0
      ?`<div style="text-align:center;color:var(--muted);padding:32px 0;font-size:14px">Nenhuma medalha registrada neste mês.</div>`
      :ranking.map((r,i)=>{
        const medals=['platinum','ouro','prata','bronze'].filter(c=>r.counts[c]>0)
          .map(c=>{const d=medalDefs.find(x=>x.cls===c);return`<span class="rank-medal-count ${c}">${d.icon} ${r.counts[c]}</span>`;}).join('');
        const podium=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}º`;
        return`<div class="rank-task-row" onclick="App.openMedalDetail('${r.task.id}')" style="cursor:pointer;transition:background .15s" onmouseenter="this.style.background='var(--surface3)'" onmouseleave="this.style.background=''">
          <div style="font-size:18px;font-weight:800;min-width:28px;text-align:center">${podium}</div>
          <div class="rank-task-name">${r.task.name}</div>
          <div class="rank-medals">${medals}</div>
          <div style="font-size:12px;color:var(--muted);flex-shrink:0">›</div>
        </div>`;
      }).join('');

    return`<div class="view">
      <div class="header">
        <div class="header-left"><h1>🏅 <span>Medalhas</span></h1></div>
      </div>
      <div style="padding:0 16px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <button onclick="App.state.medalMonth=${JSON.stringify(prevM)};App.render()" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:16px;cursor:pointer;color:var(--text);font-family:var(--font)">‹</button>
          <div style="font-size:16px;font-weight:800">${monthNames[m-1]} ${y}${isCurrentMonth?` <span style="font-size:11px;color:var(--accent);font-weight:600">(atual)</span>`:''}</div>
          <button onclick="App.state.medalMonth=${JSON.stringify(nextM)};App.render()" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:16px;cursor:pointer;color:var(--text);font-family:var(--font)">›</button>
        </div>

        <div style="font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Como funcionam</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:20px">${legendHtml}</div>

        <div style="font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Ranking por tarefa</div>
        ${rankingHtml}
      </div>
    </div>`;
  },

  // ===================== INIT =====================
  init(){
    this.loadState();
    this.applyTheme();
    this.checkMissedTasks();
    this.render();
  }
};



</script>
</body>
</html>
